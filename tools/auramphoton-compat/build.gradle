plugins {
    id 'java'
}

group = 'dev.auram.photon'
version = '0.1.0'

def libraries = file(providers.gradleProperty('prismLibraries').get())
def mods = file(providers.gradleProperty('auramMods').get())
def dh333Jar = providers.gradleProperty('distantHorizons333Jar')
def dhRenderer = dh333Jar.isPresent() ? 'dh333' : 'dh245'
def dhVersion = dh333Jar.isPresent() ? '3.3.3' : '2.4.5-b'
def dhJar = dh333Jar.isPresent() ? file(dh333Jar.get()) : new File(mods, 'DistantHorizons-2.4.5-b-1.20.1-fabric-forge.jar')
def dhMixins = "auramphoton_compat-${dhRenderer}.mixins.json"
def auramCorePriority = dh333Jar.isPresent() && providers.gradleProperty('auramCorePriority').isPresent()
def mixinConfigs = ['auramphoton_compat.mixins.json', dhMixins]

sourceSets.main.java.srcDir("src/${dhRenderer}/java")
sourceSets.main.resources.srcDir("src/${dhRenderer}/resources")
if (auramCorePriority) {
    sourceSets.main.resources.srcDir('src/dh333AuramCore/resources')
    mixinConfigs.add('auramphoton_auramcore-dh333.mixins.json')
}

dependencies {
    compileOnly files(
        new File(libraries, 'net/minecraftforge/javafmllanguage/1.20.1-47.4.10/javafmllanguage-1.20.1-47.4.10.jar'),
        new File(libraries, 'net/minecraftforge/fmlcore/1.20.1-47.4.10/fmlcore-1.20.1-47.4.10.jar'),
        new File(libraries, 'net/minecraftforge/fmlloader/1.20.1-47.4.10/fmlloader-1.20.1-47.4.10.jar'),
        new File(libraries, 'org/ow2/asm/asm/9.7.1/asm-9.7.1.jar'),
        new File(libraries, 'org/spongepowered/mixin/0.8.5/mixin-0.8.5.jar'),
        new File(libraries, 'com/google/guava/guava/31.1-jre/guava-31.1-jre.jar'),
        new File(libraries, 'it/unimi/dsi/fastutil/8.5.9/fastutil-8.5.9.jar'),
        new File(libraries, 'org/joml/joml/1.10.5/joml-1.10.5.jar'),
        new File(libraries, 'org/lwjgl/lwjgl/3.3.1/lwjgl-3.3.1.jar'),
        new File(libraries, 'org/lwjgl/lwjgl-opengl/3.3.1/lwjgl-opengl-3.3.1.jar'),
        new File(mods, 'embeddium-0.3.31+mc1.20.1.jar'),
        new File(mods, 'oculus-mc1.20.1-1.8.0.jar'),
        dhJar
    )
    if (dh333Jar.isPresent()) {
        compileOnly files(new File(libraries,
            'net/minecraft/client/1.20.1-20230612.114412/client-1.20.1-20230612.114412-srg.jar'))
    }
}

tasks.named('processResources') {
    inputs.property('dhVersion', dhVersion)
    filesMatching('META-INF/mods.toml') {
        expand(dhVersion: dhVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs += '-proc:none'
}

if (providers.gradleProperty('macosMetal').isPresent()) {
    def jniHeaders = file(new File(System.getProperty('java.home'), 'include'))
    def source = file('src/main/native/MetalLightVolume.m')
    def binary = layout.buildDirectory.file('native/macos-arm64/libauramphoton-metal.dylib')
    def compileMacosMetal = tasks.register('compileMacosMetal', Exec) {
        inputs.file(source)
        outputs.file(binary)
        doFirst {
            binary.get().asFile.parentFile.mkdirs()
        }
        commandLine 'xcrun', 'clang', '-arch', 'arm64', '-mmacosx-version-min=11.0',
            '-dynamiclib', '-O2', '-fobjc-arc',
            '-I', jniHeaders, '-I', new File(jniHeaders, 'darwin'),
            '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'IOSurface',
            '-framework', 'OpenGL', source, '-o', binary.get().asFile
    }
    tasks.named('processResources') {
        from(compileMacosMetal) {
            into 'dev/auram/photon/compat/lpv'
        }
    }
}

jar {
    if (dh333Jar.isPresent()) {
        archiveClassifier = dhRenderer
    }
    manifest {
        attributes 'MixinConfigs': mixinConfigs.join(',')
    }
}
