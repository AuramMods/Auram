# Wormholes — en_US
#
# === File editing ===
# plugins/Wormholes/languages/en_US.toml
# Edit this file directly. Local changes are preserved; missing or invalid entries use built-in English.
# /wormholes language server edit en_US
#
# === Prefix ===
# Message prefixes are part of their templates. {prefix} is a portal import code prefix.
#
# === Formatting ===
# Colors use &0-&f; formatting uses &k-&r (&l = bold, &r = reset).
# Hex colors support &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B and [RRGGBB].
#
# === Variables ===
# Keep variable names unchanged and use only the variables belonging to each message.
#   {access}  Portal access policy
#   {added}  Messages added by a language update
#   {address}  Network peer address
#   {after}  Message value after editing
#   {allocation}  Pocket space allocation
#   {amount}  Vault currency travel cost
#   {argument}  Unexpected command argument
#   {before}  Message value before editing
#   {biome}  Biome identifier
#   {blacklisted}  Blocked players
#   {block}  Selected block material
#   {blocks}  Placed blocks affected by rebuilding
#   {cancel}  Chat input cancellation word
#   {cells}  Number of open cells in the portal opening
#   {code}  Server or portal invitation code
#   {color}  Selected display color
#   {command}  Command path
#   {containers}  Nonempty containers affected by rebuilding
#   {cost}  Portal creation or travel cost
#   {count}  Number of portals, destinations, or messages
#   {degrees}  Image rotation in degrees
#   {depth}  Projection depth
#   {description}  Message description
#   {destination}  Travel destination
#   {detail}  Additional diagnostic details
#   {diagnostic}  Diagnostic message
#   {direction}  Travel or facing direction
#   {door}  Pocket exit door
#   {duration}  Player-specific update interval
#   {endpoint}  Wormhole endpoint identifier
#   {entities}  Affected entity count or entity update interval in ticks
#   {entity}  Entity update interval in ticks
#   {error}  Error from the last operation
#   {facing}  Portal facing direction
#   {failed}  Number of failed operations
#   {fallback}  Alternative travel result
#   {fingerprint}  Public key fingerprint
#   {free}  Available random destination slots
#   {grace}  Projection grace period in seconds
#   {group}  Language editor category
#   {id}  Object identifier
#   {incoming}  Incoming travel policy
#   {item}  Required travel item
#   {kept}  Local edits kept by a language update
#   {key}  Message or configuration key
#   {kind}  Door access type
#   {label}  Display label
#   {large_step}  Adjustment amount when shift-clicking
#   {line}  Line number within a message
#   {locale}  Language code
#   {material}  Pocket wall material
#   {maximum}  Maximum allowed value
#   {message}  Feedback message
#   {minimum}  Minimum allowed value
#   {mode}  Travel or display mode
#   {name}  Portal or player name
#   {next}  Next available option
#   {node}  Network node identifier
#   {none}  Label for no linked destination
#   {other}  Linked endpoint identifier
#   {outgoing}  Outgoing travel policy
#   {owner}  Portal owner
#   {page}  Current page number
#   {pages}  Total number of pages
#   {parameter}  Command parameter name
#   {path}  File or directory path
#   {personal}  Personal language code
#   {plugin}  Plugin name
#   {portal}  Portal name or identifier
#   {prefix}  Beginning of a portal import code
#   {previous}  Previous pocket size in blocks
#   {quality}  Projection stream quality
#   {quantity}  Required item count
#   {range}  Portal activation range in blocks
#   {readiness}  Random destination readiness state
#   {reason}  Reason for an error or decision
#   {receive}  Projection receiving state
#   {refresh}  Projection refresh interval in ticks
#   {remaining}  Time until the next language check
#   {reserved}  Reserved random destination slots
#   {resized}  Number of rebuilt pockets
#   {rotation}  Projection rotation
#   {route}  Attempted travel route
#   {rtt}  Network round-trip latency
#   {seconds}  Time in seconds
#   {section}  Language editor section
#   {send}  Projection sending state
#   {server}  Server name or identifier
#   {shape}  Shape of the portal opening
#   {size}  Pocket size in blocks
#   {skin}  Selected portal skin
#   {skipped}  Number of skipped operations
#   {space}  Pocket space identifier
#   {state}  Current access, link, or network state
#   {step}  Adjustment amount when clicking
#   {style}  Display style
#   {target}  Plugin receiving the language selection
#   {type}  Object or parameter type
#   {up}  Direction at the top of the projection
#   {updated}  Messages changed by a language update
#   {value}  Current or selected value
#   {variables}  Allowed message placeholders
#   {whitelisted}  Allowed players
#   {world}  World name
#   {x}  X coordinate
#   {y}  Y coordinate
#   {z}  Z coordinate

