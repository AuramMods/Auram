[balancing]
	#Show empty and filled rift jars in the creative catalog.
	enableRiftJars = false
	#One-in-N chance per player tick to spawn a nearby Reality Rift. Zero disables random spawning.
	#Range: > 0
	randomTicksUntilRiftSpawn = 216000
	enableHarmonium = false
	#Hide molotovs in the creative catalog, matching the accepted setting.
	disableMolotovs = false
	#Ticks at maximum heat to finish a wooden drying-table batch.
	#Range: > 1
	dryingTableTickDuration = 19200
	#Ticks at maximum heat to finish an iron drying-table batch.
	#Range: > 1
	ironDryingTableTickDuration = 14400
	#Range: > 1
	slurryHardeningTime = 36000

	[balancing.messageDistortion]
		#Distort locally displayed chat according to active alcohol/kava, cannabis and Zero effects.
		incoming = true
		#Distort chat before signing and sending it. Commands remain unchanged.
		outgoing = true

	[balancing.fluidAttributes]
		#Range: 1 ~ 1073741823
		flowerExtractDistillationTicks = 1200

