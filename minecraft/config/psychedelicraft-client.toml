
[visual]
	shader2DEnabled = true
	shader3DEnabled = true
	doMotionBlur = true
	doHeatDistortion = true
	hurtOverlayEnabled = true
	#Range: 0.0 ~ 1.0
	sunFlareIntensity = 0.25
	#Blur strength while the local singleplayer world is paused.
	#Range: 0.0 ~ 8.0
	pauseMenuBlur = 0.0
	#Near focus distance in world blocks.
	#Range: 0.0 ~ 99.0
	dofFocalPointNear = 0.2
	#Far focus distance in world blocks.
	#Range: 100.0 ~ 400.0
	dofFocalPointFar = 128.0
	#Range: 0.0 ~ 8.0
	dofFocalBlurNear = 0.0
	#Range: 0.0 ~ 8.0
	dofFocalBlurFar = 0.0
	#Range: 0.01 ~ 1.0
	digitalEffectPixelRescaleX = 0.05
	#Range: 0.01 ~ 1.0
	digitalEffectPixelRescaleY = 0.05
	#Apply the watery screen effect during peyote use.
	peyoteScreenDistortion = true

