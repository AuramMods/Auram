# Adapt configuration - skill:adapt:herbalism
# This file is canonicalized on load; comments and new keys may update automatically.

# Enables or disables this skill and everything registered under it.
# Effect: Set to false to remove the skill from menus and stop its XP and adaptations.
enabled = true
# Skill colour as #RRGGBB, used for its name and pages.
# Effect: Leave empty for the colour the skill was written with.
skillColor = ""
# XP below which an award in this skill is not shown to the player.
# Effect: Higher values hide more small awards from the XP ticker.
minXp = 100.0
# Milliseconds between Herbalism XP awards for eating.
# Effect: Higher values reduce how often eating pays; harvesting crops has no cooldown.
harvestXpCooldown = 3500.0
# XP gain tuning for the adapt:herbalism skill.
foodConsumeXP = 35.0
# XP gain tuning for the adapt:herbalism skill.
shearXP = 35.0
# XP gain tuning for the adapt:herbalism skill.
harvestPerAgeXP = 5.0
# XP gain tuning for the adapt:herbalism skill.
plantCropSeedsXP = 4.0
# XP gain tuning for the adapt:herbalism skill.
composterBaseXP = 2.5
# XP gain tuning for the adapt:herbalism skill.
composterLevelXPMultiplier = 1.25
# Controls Composter non zero level bonus for the adapt:herbalism skill.
composterNonZeroLevelBonus = 25.0
# Bonus XP when a composter empties after collection.
composterEmptyBonus = 5.0

# Server defaults and permitted choices for this skill's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

