# Adapt configuration - skill:adapt:seaborne
# This file is canonicalized on load; comments and new keys may update automatically.

# Enables or disables this skill and everything registered under it.
# Effect: Set to false to remove the skill from menus and stop its XP and adaptations.
enabled = true
# Skill colour as #RRGGBB, used for its name and pages.
# Effect: Leave empty for the colour the skill was written with.
skillColor = ""
# XP below which an award in this skill is not shown to the player.
# Effect: Higher values hide more small awards from the XP ticker.
minXp = 100.0
# Cooldown between the adapt:seaborne skill activations.
seaPickleCooldown = 60000
# Cooldown between XP awards for damaging drowned.
# Effect: Higher values reduce repeated combat XP frequency; lower values reward hits more often.
drownedDamageXpCooldown = 1500
# Cooldown between XP awards for trident damage.
# Effect: Higher values reduce repeated combat XP frequency; lower values reward hits more often.
tridentDamageXpCooldown = 1500
# XP awarded for catching a fish.
fishCaughtXp = 120.0
# XP for reeling in treasure: enchanted books, name tags, nautilus shells, saddles, or an enchanted bow or rod.
treasureCaughtXp = 250.0
# XP awarded for reeling in an entity.
entityCaughtXp = 10.0
# Cooldown between fishing XP awards.
# Effect: Higher values reduce AFK fishing XP frequency; lower values reward catches more often.
fishXpCooldown = 5000
# XP gain tuning for the adapt:seaborne skill.
tridentxpmultiplier = 4.0
# XP gain tuning for the adapt:seaborne skill.
damagedrownxpmultiplier = 3.0
# XP per second spent swimming while moving horizontally.
swimXpPerSecond = 1.0
# XP per block of horizontal distance swum.
swimXpPerBlock = 0.5
# XP for killing a sea creature such as fish, squid, dolphins, guardians, drowned, turtles, or axolotls.
seaCreatureKillXp = 150.0
# Extra sea creature kill XP per point of the victim's maximum health.
seaCreatureMaxHealthXpMultiplier = 5.0
# Additional passive swimming XP multiplier for players actively moving in water with Water Breathing or Conduit Power.
# Effect: 1.0 adds one base swim XP award for 2x total; 0 disables the bonus while retaining the base moving-swimmer award.
waterBreathingSwimXpBonusMultiplier = 1.0

# Server defaults and permitted choices for this skill's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

