# Adapt configuration - skill:adapt:pickaxe
# This file is canonicalized on load; comments and new keys may update automatically.

# Enables or disables this skill and everything registered under it.
# Effect: Set to false to remove the skill from menus and stop its XP and adaptations.
enabled = true
# Skill colour as #RRGGBB, used for its name and pages.
# Effect: Leave empty for the colour the skill was written with.
skillColor = ""
# XP below which an award in this skill is not shown to the player.
# Effect: Higher values hide more small awards from the XP ticker.
minXp = 100.0
# Controls Debris bonus for the adapt:pickaxe skill.
debrisBonus = 210.0
# XP gain tuning for the adapt:pickaxe skill.
getXpForAttackingWithTools = true
# XP gain tuning for the adapt:pickaxe skill.
damageXPMultiplier = 6.0
# Scaling applied to the adapt:pickaxe skill.
blockValueMultiplier = 0.125
# Maximum cap applied to the adapt:pickaxe skill.
maxHardnessBonus = 9.0
# Maximum cap applied to the adapt:pickaxe skill.
maxBlastResistanceBonus = 10.0
# Controls Coal bonus for the adapt:pickaxe skill.
coalBonus = 18.0
# Controls Iron bonus for the adapt:pickaxe skill.
ironBonus = 30.0
# Controls Redstone bonus for the adapt:pickaxe skill.
redstoneBonus = 55.0
# Controls Copper bonus for the adapt:pickaxe skill.
copperBonus = 22.0
# Controls Gold bonus for the adapt:pickaxe skill.
goldBonus = 38.0
# Controls Lapis bonus for the adapt:pickaxe skill.
lapisBonus = 75.0
# Milliseconds between Pickaxes combat XP awards.
# Effect: Higher values reduce repeated combat XP frequency; lower values reward hits more often.
cooldownDelay = 1250
# Controls Diamond bonus for the adapt:pickaxe skill.
diamondBonus = 175.0
# Controls Emerald bonus for the adapt:pickaxe skill.
emeraldBonus = 210.0
# Controls Nether gold bonus for the adapt:pickaxe skill.
netherGoldBonus = 105.0
# Controls Nether quartz bonus for the adapt:pickaxe skill.
netherQuartzBonus = 125.0
# Scaling applied to the adapt:pickaxe skill.
deepslateMultiplier = 1.35
# Item ids or #tags that also count as a pickaxe for this skill and all its adaptations, such as mekanismtools:osmium_paxel or #forge:tools/hammers.
# Effect: Listed tools earn Pickaxes XP and trigger its adaptations; a tag covers every item in it.
extraTools = []
# Item ids or #tags that never count as a pickaxe for this skill, whatever a tag or other rule says.
# Effect: Wins over every other rule, the extra tools list included.
excludedTools = []
# Block ids or #tags that never give Pickaxes XP or count as its work.
# Effect: Use it to stop XP from a modded block the automatic rules pick up.
excludedBlocks = []
# Counts items in the pickaxe tags minecraft:pickaxes, forge:tools/pickaxes, c:pickaxes and fabric:pickaxes as a pickaxe.
# Effect: Set to false to recognise tools only by the other rules.
toolTagRule = true
# Counts items the mod loader says dig as a pickaxe (Forge tool actions, NeoForge 1.21.1 item abilities) as a pickaxe.
# Effect: Set to false to ignore loader tool actions; Fabric and newer loaders have none.
toolCapabilityRule = true
# Counts items that are the correct tool for stone as a pickaxe, and pays Pickaxes XP for a mineable/pickaxe, ore or stone block broken with its correct tool.
# Effect: Set to false to recognise tools only by lists, tags and loader actions.
toolBehaviourRule = true

# Server defaults and permitted choices for this skill's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

# Block ids or #tags that count as this skill's work, each with the XP one block gives before placed-block scaling.
# Effect: Listed blocks use this XP instead of the derived value, and any tool of this skill earns it.
[extraBlocks]

