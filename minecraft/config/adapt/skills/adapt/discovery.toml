# Adapt configuration - skill:adapt:discovery
# This file is canonicalized on load; comments and new keys may update automatically.

# Enables or disables this skill and everything registered under it.
# Effect: Set to false to remove the skill from menus and stop its XP and adaptations.
enabled = true
# Skill colour as #RRGGBB, used for its name and pages.
# Effect: Leave empty for the colour the skill was written with.
skillColor = ""
# XP below which an award in this skill is not shown to the player.
# Effect: Higher values hide more small awards from the XP ticker.
minXp = 100.0
# Controls Show particles for the adapt:discovery skill.
showParticles = true
# Sends new-discovery particles forced, so they show on reduced particle settings and are never thinned under load.
# Effect: True forces them and false treats them as ambient effects.
forceDiscoveryParticles = true
# XP gain tuning for the adapt:discovery skill.
discoverBiomeXP = 15.0
# XP gain tuning for the adapt:discovery skill.
discoverPotionXP = 36.0
# XP gain tuning for the adapt:discovery skill.
discoverEntityTypeXP = 125.0
# XP gain tuning for the adapt:discovery skill.
discoverFoodTypeXP = 75.0
# XP gain tuning for the adapt:discovery skill.
discoverPlayerXP = 125.0
# XP gain tuning for the adapt:discovery skill.
discoverEnvironmentXP = 750.0
# XP for completing a non-Adapt task advancement.
advancementTaskXP = 150.0
# XP the first time you enter each chunk.
discoverChunkXP = 2.0
# XP for opening a naturally generated loot container before anyone else.
discoverLootContainerXP = 40.0
# XP for completing a non-Adapt goal advancement.
advancementGoalXP = 400.0
# XP for completing a non-Adapt challenge advancement.
advancementChallengeXP = 1000.0
# XP gain tuning for the adapt:discovery skill.
discoverWorldXP = 750.0
# XP gain tuning for the adapt:discovery skill.
discoverEnchantMaxXP = 250.0
# XP gain tuning for the adapt:discovery skill.
discoverEnchantLevelXPMultiplier = 52.0
# XP gain tuning for the adapt:discovery skill.
discoverEnchantBaseXP = 5.0
# XP gain tuning for the adapt:discovery skill.
discoverItemBaseXP = 10.0
# XP gain tuning for the adapt:discovery skill.
discoverRecipeBaseXP = 15.0
# XP gain tuning for the adapt:discovery skill.
discoverItemValueXPMultiplier = 1.0
# XP gain tuning for the adapt:discovery skill.
discoverBlockBaseXP = 3.0
# XP gain tuning for the adapt:discovery skill.
discoverBlockValueXPMultiplier = 0.333
# Maximum target-block checks per scheduler pass.
# Effect: Higher values refresh very large servers faster but increase per-tick ray tracing.
maxTargetChecksPerPass = 64

# Server defaults and permitted choices for this skill's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

