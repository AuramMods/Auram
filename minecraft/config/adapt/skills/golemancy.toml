# Adapt configuration - skill:golemancy
# This file is canonicalized on load; comments and new keys may update automatically.

# Enables or disables the Golemancy skill.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Legacy ampersand color code used for Golemancy in menus and text.
# Effect: Changes only how the skill name is colored.
skillColor = "&3"
# Skill XP paid for building a snow golem.
# Effect: Higher values reward snow golem builds more; 0 pays nothing.
buildSnowXp = 40.0
# Skill XP paid for building a copper golem.
# Effect: Higher values reward copper golem builds more; 0 pays nothing.
buildCopperXp = 90.0
# Skill XP paid for building an iron golem.
# Effect: Higher values reward iron golem builds more; 0 pays nothing.
buildIronXp = 180.0
# Milliseconds before one player earns build XP again for the same golem type.
# Effect: Higher values limit repeated build XP; the builder record is still written during the cooldown.
buildXpCooldownMillis = 20000
# Milliseconds a placed carved pumpkin or jack o'lantern and a golem spawn may be apart and still credit the builder.
# Effect: Higher values tolerate more delay between the head placement and the spawn.
buildAttributionWindowMillis = 250
# Blocks between the placed head block and the spawned golem for the build to credit the player.
# Effect: Higher values match builds farther from the head block.
buildAttributionRadius = 3.0
# Blocks from a golem within which players earn witness XP when it kills a hostile mob.
# Effect: Higher values let players farther away share in golem kills.
witnessRadius = 16.0
# Fraction of the golem kill value paid to each witnessing player.
# Effect: Higher values pay more witness XP per kill.
witnessXpMultiplier = 0.35
# Milliseconds before one player earns witness XP again from the same golem.
# Effect: Higher values limit witness XP from a single busy golem.
witnessCooldownMillis = 6000
# Most witness XP one player can earn in any rolling 60 minutes.
# Effect: Higher values allow more passive witness XP per hour.
witnessHourlyCap = 1200.0
# Base skill XP value of a golem kill before the victim's health is added.
# Effect: Higher values raise the value of every golem kill.
golemKillXpBase = 15.0
# Skill XP added to a golem kill value per point of the victim's maximum health.
# Effect: Higher values make tougher victims worth more.
golemKillMaxHealthMultiplier = 1.0
# Skill XP per point of health restored when repairing an iron golem, or healing a bound golem with Golem Mending, that hostile mobs damaged.
# Effect: Higher values pay more for repairs; damage from players never counts.
repairXpPerHealth = 2.0
# Skill XP paid for scraping one oxidation stage off a copper golem with an axe.
# Effect: Higher values reward copper golem care more.
copperScrapeXp = 60.0
# Skill XP paid the first time you wax a copper golem with honeycomb.
# Effect: Higher values reward waxing more; each golem pays once.
copperWaxXp = 30.0
# Skill XP paid for each Artificer's Crook crafted.
# Effect: Higher values pay more for crafting the Crook.
craftCrookXp = 60.0
# Skill XP paid for each Blank Animus Core crafted.
# Effect: Higher values pay more for crafting blank cores.
craftBlankCoreXp = 40.0
# Skill XP paid for each role core crafted.
# Effect: Higher values pay more for crafting role cores.
craftRoleCoreXp = 90.0
# Skill XP paid for each Blank Node crafted, counted per node in the result.
# Effect: Higher values pay more for crafting blank nodes.
craftBlankNodeXp = 5.0
# Skill XP paid for each typed node crafted.
# Effect: Higher values pay more for crafting nodes.
craftNodeXp = 15.0
# Skill XP paid for each Blank Rune crafted, counted per craft, not per rune in the result.
# Effect: Higher values pay more for crafting blank runes.
craftBlankRuneXp = 10.0
# Multiplier applied to Golemancy XP from mobs that came from a spawner or trial spawner.
# Effect: Lower values make spawner farms pay less; 1.0 pays the same as natural mobs.
spawnerMobXpMultiplier = 0.3
# Skill XP paid the first time a frost golem is bound.
# Effect: Higher values reward binding frost golems more; a golem that was bound before pays nothing.
bindFrostXp = 100.0
# Skill XP paid the first time a copper golem is bound.
# Effect: Higher values reward binding copper golems more; a golem that was bound before pays nothing.
bindCopperXp = 220.0
# Skill XP paid the first time an iron golem is bound.
# Effect: Higher values reward binding iron golems more; a golem that was bound before pays nothing.
bindIronXp = 450.0
# Milliseconds before one player earns bind XP again for the same golem type. Bindings during the cooldown still count toward golemancy.bound.
# Effect: Higher values stop build, bind and release loops from paying bind XP quickly.
bindXpCooldownMillis = 20000
# Most build and bind XP one player can earn together in any rolling 60 minutes. First-bind challenges are not counted. Values below 0 count as 0.
# Effect: Higher values let build, bind and release loops pay more per hour; 0 pays no build or bind XP.
bindXpHourlyCap = 1200.0
# Skill XP paid with each first-bind challenge, the first time you bind a frost, copper or iron golem.
# Effect: Higher values make each first bind worth more; each challenge pays once per player.
firstBindXp = 600.0
# Skill XP per point of damage your bound golems deal to hostile mobs, before the body multiplier. Damage beyond the victim's remaining health does not count.
# Effect: Higher values pay more for golem combat.
assistDamageXpMultiplier = 3.0
# Body multiplier for damage XP from bound frost golems, including their snowballs.
# Effect: Higher values pay more for frost golem damage.
assistBodyMultiplierFrost = 2.0
# Body multiplier for damage XP from bound copper golems.
# Effect: Higher values pay more for copper golem damage.
assistBodyMultiplierCopper = 1.0
# Body multiplier for damage XP from bound iron golems.
# Effect: Higher values pay more for iron golem damage.
assistBodyMultiplierIron = 1.0
# Milliseconds before one player earns damage XP from their bound golems again.
# Effect: Higher values limit damage XP from many golems or fast hits; damage still counts toward golemancy.golem.damage.
assistCooldownMillis = 1500
# Multiplier on kill XP when a bound golem kills a raider that belongs to an active raid.
# Effect: Higher values reward defending villages from raids more; 1.0 pays the same as other kills.
raidXpMultiplier = 1.5
# Blocks from a bound golem within which its owner earns full damage, kill and tanking XP.
# Effect: Higher values let owners stay farther from their golems without losing XP.
ownerProximityRadius = 48.0
# Multiplier on damage, kill and tanking XP when the owner is farther than ownerProximityRadius from the golem or in another world. Clamped to 0-1.
# Effect: Lower values pay less to owners who leave their golems fighting alone; 0 pays nothing.
distantOwnerXpMultiplier = 0.25
# Skill XP per point of damage your bound golems take from hostile mobs. Damage beyond the golem's remaining health does not count.
# Effect: Higher values pay more for golems that soak up hits.
tankXpMultiplier = 1.5
# Milliseconds before one player earns tanking XP from their bound golems again.
# Effect: Higher values limit tanking XP from many golems or fast hits.
tankCooldownMillis = 2000
# Makes bound golems invulnerable while they are dormant.
# Effect: Set to false to let dormant golems take damage while their owner is offline.
dormantInvulnerable = true
# Keeps Guardian golems awake while their owner is offline.
# Effect: Set to true to let Guardian golems keep defending while their owner is away.
guardWhileOwnerOffline = false
# Most bound golems that may be awake on the whole server at once.
# Effect: Lower values save server performance; golems beyond the limit stay dormant until room frees.
serverMaxActiveGolems = 1500
# Most bound golems allowed in one chunk when binding.
# Effect: Lower values spread golems out; binding fails in a chunk that is already full.
maxBoundGolemsPerChunk = 8
# Most golems one player can own at once, counting bound, packed, and shattered golems, and missing golems until they are released.
# Effect: Lower values limit every player, whatever their adaptation levels allow.
hardCapPerPlayer = 32
# Size of a bound frost golem as a multiple of its normal size.
# Effect: Lower values make bound frost golems smaller; 1.0 keeps the normal size.
bodyScaleFrost = 0.5
# Size of a bound copper golem as a multiple of its normal size.
# Effect: Lower values make bound copper golems smaller; 1.0 keeps the normal size.
bodyScaleCopper = 1.0
# Size of a bound iron golem as a multiple of its normal size.
# Effect: Lower values make bound iron golems smaller; 1.0 keeps the normal size.
bodyScaleIron = 0.36
# Size of a bound bone golem as a multiple of its normal size.
# Effect: Lower values make bound bone golems smaller; 1.0 keeps the normal size.
bodyScaleBone = 0.49
# Items a bound frost golem can carry at once.
# Effect: Higher values let working frost golems move more items per trip.
bodyCarryFrost = 8
# Items a bound copper golem can carry at once before Copper Frame raises it.
# Effect: Higher values let working copper golems move more items per trip.
bodyCarryCopper = 16
# Items a bound iron golem can carry at once.
# Effect: Higher values let working iron golems move more items per trip.
bodyCarryIron = 64
# Cores a frost golem can be bound with.
# Effect: Remove a core to stop frost golems taking that role.
allowedCoresFrost = ["BLANK", "GUARDIAN", "GATHERER", "HARVESTER"]
# Cores a copper golem can be bound with.
# Effect: Remove a core to stop copper golems taking that role.
allowedCoresCopper = ["BLANK", "GATHERER", "HARVESTER", "LUMBER", "BREAKER", "RANCHER", "SORTER", "ANGLER"]
# Cores an iron golem can be bound with.
# Effect: Remove a core to stop iron golems taking that role.
allowedCoresIron = ["BLANK", "GUARDIAN", "GATHERER", "LUMBER", "BREAKER", "RANCHER", "ANGLER"]
# Chance that each core drops when a bound golem dies without leaving a Shattered Core.
# Effect: Higher values return more cores on death; 1.0 always drops them.
deathDropCoreChance = 0.5
# Chance that each rune drops when a bound golem dies without leaving a Shattered Core.
# Effect: Higher values return more runes on death; 1.0 always drops them.
deathDropRuneChance = 0.5
# Ticks between bound golem decisions, clamped to 2-20.
# Effect: Lower values make golems react faster but cost more server time.
brainIntervalTicks = 5
# Blocks from its owner, in the same world, at which a following golem teleports to them instead of walking. The minimum is 8.
# Effect: Lower values teleport golems sooner; higher values make them walk farther first.
followTeleportDistance = 32.0
# Blocks a fighting or working golem may stray from its owner, home, or stay spot before it drops the fight or job and walks back. It is also the farthest a linked home chest may be from the golem's home. The minimum is 8.
# Effect: Higher values let golems chase enemies and work farther out; keep it at least baseWorkRadius plus the largest Tide rune bonus so golems can finish jobs at the edge of their reach.
leashRadius = 48.0
# Seconds a working golem stands idle away from home before it walks back.
# Effect: Lower values send idle golems home sooner; 0 sends them home at once.
idleReturnSeconds = 8
# Ticks between path refreshes for a moving copper golem, clamped to 2-20.
# Effect: Lower values keep copper golems on course; higher values leave a copper golem standing longer after something, such as taking damage, stops its path.
copperRepathTicks = 10
# Blocks around you within which your golems glow in their channel color and show you their status, your skeletal servants glow with Bone Frame, and your nodes appear while you hold the Crook, a Node, a Core or a Dormant Golem.
# Effect: Higher values reveal golems and nodes farther away; lower values do less work on busy servers.
revealRange = 32.0
# Blocks within which revealed golem and node labels are drawn on screen, and within which a golem you look at shows you its status in the Gloss entity overlay.
# Effect: Higher values let you read labels and golem status from farther away.
labelRange = 8.0
# Ticks between checks that reveal or hide golems and nodes as you move while holding the Crook, a Node, a Core or a Dormant Golem.
# Effect: Lower values react to movement faster; holding none of them costs nothing.
revealPollTicks = 10
# Most nodes allowed in one chunk, counting every player's nodes.
# Effect: Lower values spread nodes out; placing a node fails in a chunk that is already full.
maxNodesPerChunk = 16
# Ticks between checks of each node, clamped to 5-1200. Each check confirms the node's block is still there.
# Effect: Lower values notice broken node blocks sooner but cost more server time.
nodeScanIntervalTicks = 40
# Most blocks of a node's work area looked at in one check, clamped to 1-4096.
# Effect: Higher values let nodes find work faster in large areas but cost more server time.
blocksPerNodeScan = 64
# Most unfinished jobs one node can hand out to golems at once, clamped to 1-256.
# Effect: Higher values let more golems work one node at the same time.
maxOpenTasksPerNode = 16
# Who can see nodes while holding the Crook, a Node, a Core or a Dormant Golem: OWNER shows each player only their own nodes, ANY_GOLEMANCER also shows every node to players with Node Weaving.
# Effect: Set to ANY_GOLEMANCER to let golemancers see each other's nodes.
nodeVisibility = "OWNER"
# Seconds a golem keeps its claim on a node job without making progress before another golem may take it, clamped to 5-600.
# Effect: Lower values let other golems take over stalled jobs sooner; higher values tolerate slow walks to far jobs.
taskLeaseSeconds = 20
# Blocks around its home within which a working golem takes node jobs, finds Deposit Nodes and defends Guard Nodes, clamped to 4-128.
# Effect: Higher values let golems work, deliver and guard farther from home.
baseWorkRadius = 32.0
# Seconds a golem walking to a job or a container may go without getting half a block closer before it gives up and skips that job or container for 10 seconds, clamped to 1-60.
# Effect: Lower values give up on blocked paths sooner; higher values keep trying longer.
stuckTimeoutSeconds = 4
# Jobs or containers in a row a golem may give up because it got stuck before it rests for stuckPauseSeconds, clamped to 1-100.
# Effect: Lower values rest trapped golems sooner; higher values keep them trying longer.
stuckReleasesBeforePause = 3
# Seconds a trapped golem rests without looking for jobs or containers after giving up stuckReleasesBeforePause in a row, clamped to 0-600.
# Effect: Higher values save server time on trapped golems; 0 never rests them.
stuckPauseSeconds = 15
# Most work XP one player can earn from their golems' finished jobs in any rolling 60 minutes. Values below 0 count as 0.
# Effect: Higher values allow more passive XP from golem labor per hour; 0 pays no work XP.
workXpHourlyCap = 2400.0
# Blocks from a working golem within which its owner earns work XP for its finished jobs. Owners farther away or in another world earn none. Values below 0 count as 0.
# Effect: Higher values let owners earn work XP while farther from their golems.
workXpOwnerRadius = 96.0
# Blocks that work as Animus Plinth pedestals, two blocks north, east, south and west of a lodestone at the same height.
# Effect: Add or remove block names to change which blocks form a plinth; unknown names and the lodestone are ignored with a warning.
pedestalBlocks = ["CUT_COPPER", "EXPOSED_CUT_COPPER", "WEATHERED_CUT_COPPER", "OXIDIZED_CUT_COPPER", "WAXED_CUT_COPPER", "WAXED_EXPOSED_CUT_COPPER", "WAXED_WEATHERED_CUT_COPPER", "WAXED_OXIDIZED_CUT_COPPER"]
# Skill XP paid for each tier 1 rune infused at an Animus Plinth.
# Effect: Higher values reward tier 1 infusions more; 0 pays nothing.
infuseRuneTier1Xp = 60.0
# Skill XP paid for each tier 2 rune infused at an Animus Plinth.
# Effect: Higher values reward tier 2 infusions more; 0 pays nothing.
infuseRuneTier2Xp = 180.0
# Skill XP paid for each tier 3 rune infused at an Animus Plinth.
# Effect: Higher values reward tier 3 infusions more; 0 pays nothing.
infuseRuneTier3Xp = 450.0
# Skill XP paid for each Masterwork Heart infused at an Animus Plinth.
# Effect: Higher values reward Masterwork Heart infusions more; 0 pays nothing.
infuseMasterworkHeartXp = 1500.0

# Controls Player preferences for the golemancy skill.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

# Infusions an Animus Plinth can perform, one table per infusion with result, center, pedestals, essenceLevels, durationTicks, unlockAdaptation, unlockLevel and enabled.
# Effect: Edit a table to change an infusion, set enabled to false to turn it off, or add a table to create a new one; invalid tables are skipped with a warning.
[infusionRecipes]

[infusionRecipes.bulwark_1]
# Item this infusion makes: a rune such as golemancy:rune/swiftness/1, or golemancy:masterwork_heart.
# Effect: Runes take an aspect (swiftness, might, ember, tide, order, entropy or bulwark) and a tier from 1 to 3.
result = "golemancy:rune/bulwark/1"
# Item that must sit on the lodestone.
# Effect: Accepts a material name such as HEART_OF_THE_SEA or a Golemancy item such as golemancy:blank_rune. A material never matches a Golemancy item made from it.
center = "golemancy:blank_rune"
# The four items that must sit on the pedestals, in any order.
# Effect: List exactly four material names or Golemancy items; repeat an entry to need it on more than one pedestal.
pedestals = ["IRON_INGOT", "IRON_INGOT", "OBSIDIAN", "OBSIDIAN"]
# Experience levels charged when the infusion completes.
# Effect: 0 makes the infusion free. Creative players never pay.
essenceLevels = 2
# Ticks the ritual takes, clamped to 20-6000.
# Effect: Higher values make the player wait longer beside the plinth.
durationTicks = 100
# Id of the Golemancy adaptation that unlocks this infusion.
# Effect: Players need this adaptation at unlockLevel or higher; its region protection rules apply to the ritual.
unlockAdaptation = "golem-runic-augments"
# Lowest level of unlockAdaptation that can perform this infusion; at least 1.
# Effect: Higher values unlock the infusion later.
unlockLevel = 1
# Allows this infusion.
# Effect: Set to false to turn the infusion off without deleting it.
enabled = true

