# Adapt configuration - adaptation:adapt:swords/upgrade/tempest_flow
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sword hits build attack speed; a critical hit at full stacks releases a crimson area slash.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Stacks needed for the release, before adding the level.
# Effect: Higher values need longer chains before the slash.
stackCapBase = 2
# How long a stack survives without a new hit, in milliseconds.
# Effect: Higher values keep the flow alive longer between strikes.
windowMillis = 4500.0
# Slash damage before level scaling.
# Effect: Higher values make the area slash hit harder.
slashDamageBase = 2.0
# Slash damage added per level.
# Effect: Higher values reward higher levels more.
slashDamagePerLevel = 1.5
# Slash radius before level scaling, in blocks.
# Effect: Higher values reach more targets.
slashRadiusBase = 3.0
# Slash radius added per level, in blocks.
# Effect: Higher values widen the slash at higher levels.
slashRadiusPerLevel = 0.5
# Time between two releases, in milliseconds.
# Effect: Lower values allow more frequent slashes.
slashCooldownMillis = 6000.0
# Bleed damage per proc on every target the slash hits.
# Effect: Higher values make the bleed hit harder.
bleedDamagePerProc = 0.6
# Bleed duration on every target the slash hits, in ticks.
# Effect: Higher values make the bleed last longer.
bleedTicks = 100
# Exclude passive and neutral mobs from the slash and its bleeding.
# Effect: When enabled, protected mobs do not use up target limits.
ignorePassiveMobs = false
# Most nearby living targets one slash inspects.
# Effect: Lower values reduce work in crowds; clamped to 32.
maxCandidatesPerActivation = 16
# Most targets one slash hits, including the struck target.
# Effect: Lower values cap damage in crowds; clamped to 16.
maxAffectedPerActivation = 12
# Most hit targets that get their own spark effect.
# Effect: Lower values reduce particles; clamped to 12.
maxTargetFxPerActivation = 9
# Skill XP for each stack built.
# Effect: Higher values reward long chains.
xpPerStack = 3.0
# Skill XP for each target the slash hits.
# Effect: Higher values reward slashing groups.
xpPerTargetHit = 10.0
# Sword durability one whetstone grind costs.
# Effect: Higher values wear the sword faster per grind.
whetstoneDurabilityCost = 10
# Combat time one grind lasts, in milliseconds.
# Effect: Higher values make each whetstone last longer.
whetstoneCombatMillis = 600000.0
# Most combat time one hit spends from a grind, in milliseconds.
# Effect: Higher values use up grinds faster between spaced hits.
whetstoneMillisPerHit = 5000.0
# Serrated bleed damage per pulse before level scaling; scales with Witherblade.
# Effect: Higher values make Serrated bleed harder.
serratedBleedBase = 0.3
# Serrated bleed damage per pulse added per Witherblade level.
# Effect: Higher values reward Witherblade more.
serratedBleedPerLevel = 0.2
# How long one Serrated bleed lasts, in milliseconds.
# Effect: Higher values make each bleed last longer.
serratedBleedMillis = 3000.0
# Weighted stagger and shield lockout before level scaling, in ticks; scales with Tempest Flow.
# Effect: Higher values keep targets off balance longer.
weightedTicksBase = 20.0
# Weighted stagger and shield lockout added per Tempest Flow level, in ticks.
# Effect: Higher values reward Tempest Flow more.
weightedTicksPerLevel = 10.0
# Slowness amplifier of the Weighted stagger; 0 is Slowness I.
# Effect: Higher values slow staggered targets more.
weightedSlownessAmplifier = 0
# Time before the same target can be staggered again, in milliseconds.
# Effect: Lower values let Weighted stagger more often.
weightedCooldownMillis = 3000.0
# Keen critical damage bonus before level scaling; scales with Duelist's Verdict.
# Effect: Higher values make Keen crits hit harder.
keenBonusBase = 0.1
# Keen critical damage bonus added per Duelist's Verdict level.
# Effect: Higher values reward Duelist's Verdict more.
keenBonusPerLevel = 0.1

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.bleed-visuals]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.ignore-passive]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "OFF"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

