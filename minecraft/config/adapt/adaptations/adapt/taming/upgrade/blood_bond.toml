# Adapt configuration - adaptation:adapt:taming/upgrade/blood_bond
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Pets share your damage, intercept shots aimed at you, and return to you at 1 HP instead of dying.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Share of your incoming damage spread across nearby pets before level scaling.
# Effect: Higher values move more of every hit onto your pets.
sharePercentBase = 0.25
# Share of incoming damage added per level.
# Effect: Higher values reward higher levels more.
sharePercentPerLevel = 0.1
# Highest share of a hit your pets can take.
# Effect: Caps the shared damage.
maxSharePercent = 0.6
# Health each pet keeps before it stops taking shared damage.
# Effect: Higher values protect pets more and share less.
petHealthFloor = 2.0
# Radius in blocks searched for pets that share damage or intercept shots.
# Effect: Higher values let farther pets help.
radius = 12.0
# Most pets that share one hit, capped at 16.
# Effect: Higher values spread damage more thinly.
maxPets = 8
# Chance a pet intercepts a shot before level scaling.
# Effect: Higher values make intercepts more common.
interceptChanceBase = 0.4
# Intercept chance added per level.
# Effect: Higher values reward higher levels more.
interceptChancePerLevel = 0.15
# Highest intercept chance at any level.
# Effect: Caps the intercept chance.
maxInterceptChance = 0.85
# Share of an intercepted shot the pet does not take.
# Effect: Higher values make intercepts cheaper for the pet.
petReduction = 0.6
# Leap velocity of a pet intercepting a shot.
# Effect: Higher values make the pet lunge harder.
leapStrength = 0.8
# Time between two intercepts, in milliseconds.
# Effect: Lower values let pets block more of a barrage.
interceptCooldownMillis = 1000.0
# Per-pet time between two saves at level 1, in milliseconds.
# Effect: Higher values make saves rarer.
saveCooldownMillisBase = 240000.0
# Save cooldown removed at the top level, in milliseconds.
# Effect: Higher values shorten the cooldown faster as you level.
saveCooldownMillisReduction = 180000.0
# Shortest per-pet save cooldown, in milliseconds.
# Effect: Lower values allow more frequent saves.
minimumSaveCooldownMillis = 45000.0
# Ticks a saved pet cannot be hurt, at least 10.
# Effect: Higher values give the pet longer to escape.
invulnTicks = 60
# Skill XP per point of damage your pets share.
# Effect: Higher values reward fighting beside your pets.
xpPerSharedDamage = 2.0
# Skill XP per point of damage a pet intercepts.
# Effect: Higher values reward intercepts.
xpPerInterceptedDamage = 2.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.pet-health-reserve]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "DEFAULT"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["DEFAULT", "HALF", "THREE_QUARTERS"]

[playerPreferences.pets]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ALL"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ALL", "WOLVES", "CATS", "HORSES"]

