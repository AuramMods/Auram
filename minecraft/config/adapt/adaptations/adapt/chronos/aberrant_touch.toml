# Maximum cap applied to the adapt:chronos/aberrant_touch adaptation.
entityAmplifierCap = 4
# Controls Hunger cost for the adapt:chronos/aberrant_touch adaptation.
hungerCost = 1.0
# Minimum threshold required for the adapt:chronos/aberrant_touch adaptation.
minimumFoodLevel = 4
# Controls Root at stacks for the adapt:chronos/aberrant_touch adaptation.
