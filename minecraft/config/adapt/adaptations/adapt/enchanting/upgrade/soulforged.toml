# Adapt configuration - adaptation:adapt:enchanting/upgrade/soulforged
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Gear linked at an anvil survives death, grows with collected XP and sheds its curses.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Experience levels it costs to keep the linked item through a death, before level scaling.
# Effect: Higher values make each save dearer.
saveCostBase = 6.0
# Experience levels removed from the save cost per level.
# Effect: Higher values make higher levels cheaper.
saveCostReductionPerLevel = 2.0
# Lowest save cost in experience levels.
# Effect: Zero lets the top level save for free.
minimumSaveCost = 1
# Charge gained per vanilla XP point before level scaling.
# Effect: Higher values grow linked gear faster.
chargeRateBase = 2.0
# Charge rate added per level.
# Effect: Higher values widen the gap between levels.
chargeRatePerLevel = 1.0
# Charge needed to raise one enchantment a level.
# Effect: Higher values make growth slower.
chargeThreshold = 120
# Time before another item can be linked, before level scaling, in milliseconds.
# Effect: Higher values make relinking rarer.
relinkCooldownMillisBase = 30000.0
# Relink cooldown removed per level, in milliseconds.
# Effect: Higher values allow faster relinks at higher levels.
relinkCooldownMillisReductionPerLevel = 8000.0
# Shortest relink cooldown, in milliseconds.
# Effect: Lower values allow more frequent relinks.
minimumRelinkCooldownMillis = 5000.0
# Whether linked gear can ascend an enchantment past its vanilla maximum.
# Effect: False removes Ascension and puts every ascended item to sleep.
ascension = true
# Enchantments that may ascend.
# Effect: Remove an id to keep it at its vanilla maximum. Single-level enchantments never ascend.
ascendable = ["minecraft:sharpness", "minecraft:smite", "minecraft:bane_of_arthropods", "minecraft:efficiency", "minecraft:unbreaking", "minecraft:fortune", "minecraft:looting", "minecraft:power", "minecraft:protection", "minecraft:fire_protection", "minecraft:blast_protection", "minecraft:projectile_protection", "minecraft:feather_falling"]
# Ascended enchantments one item may hold, before level scaling.
# Effect: Higher values allow more ascensions per item.
ascensionsBase = 0.5
# Ascended enchantments added per level.
# Effect: Higher values add ascensions sooner.
ascensionsPerLevel = 0.5
# Experience levels one ascension costs, before level scaling.
# Effect: Higher values make ascending dearer.
ascensionCostBase = 35.0
# Experience levels removed from the ascension cost per level.
# Effect: Higher values make higher levels cheaper.
ascensionCostReductionPerLevel = 5.0
# How often each online player's ascended gear is woken or put to sleep, in milliseconds.
# Effect: Lower values react faster to gear changing hands.
settleIntervalMillis = 1000

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

