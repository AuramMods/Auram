# Adapt configuration - adaptation:adapt:sword/crimson_cyclone
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Land a sword crit while falling to unleash a bleeding crimson cyclone around your target.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Exclude passive and neutral mobs from area damage and its secondary effects.
# Effect: When enabled, protected mobs do not consume target limits. Direct attacks and player targeting are unchanged.
ignorePassiveMobs = false
# Controls Show bleed particles for the adapt:sword/crimson_cyclone adaptation.
showBleedParticles = true
# Distance/area limit used by the adapt:sword/crimson_cyclone adaptation.
radiusBase = 2.6
# Scaling applied to the adapt:sword/crimson_cyclone adaptation.
radiusFactor = 2.4
# Controls Base damage for the adapt:sword/crimson_cyclone adaptation.
baseDamage = 2.0
# Scaling applied to the adapt:sword/crimson_cyclone adaptation.
damageFactor = 4.0
# Duration or timing used by the adapt:sword/crimson_cyclone adaptation.
bleedTicksBase = 40.0
# Scaling applied to the adapt:sword/crimson_cyclone adaptation.
bleedTicksFactor = 90.0
# Controls Bleed damage per proc base for the adapt:sword/crimson_cyclone adaptation.
bleedDamagePerProcBase = 0.35
# Scaling applied to the adapt:sword/crimson_cyclone adaptation.
bleedDamagePerProcFactor = 0.45
# Controls Hunger cost base for the adapt:sword/crimson_cyclone adaptation.
hungerCostBase = 2.0
# Scaling applied to the adapt:sword/crimson_cyclone adaptation.
hungerCostFactor = 2.0
# Controls Durability cost base for the adapt:sword/crimson_cyclone adaptation.
durabilityCostBase = 3.0
# Scaling applied to the adapt:sword/crimson_cyclone adaptation.
durabilityCostFactor = 1.5
# Cooldown between the adapt:sword/crimson_cyclone adaptation activations.
cooldownTicksBase = 320.0
# Cooldown between the adapt:sword/crimson_cyclone adaptation activations.
cooldownTicksFactor = 160.0
# XP gain tuning for the adapt:sword/crimson_cyclone adaptation.
xpPerTargetHit = 10.0
# Maximum secondary living targets inspected by one crimson cyclone.
# Effect: Lower values reduce dense-entity scheduling; values are clamped to an absolute maximum of 32.
maxCandidatesPerActivation = 16
# Maximum total targets hit by one crimson cyclone, including the primary target.
# Effect: Lower values cap combat work and rewards in dense groups; values are clamped to an absolute maximum of 16.
maxAffectedPerActivation = 12
# Maximum hit targets that receive individual crimson spark effects.
# Effect: Lower values reduce particle dispatch while preserving the cyclone ring; values are clamped to an absolute maximum of 12.
maxTargetFxPerActivation = 9

