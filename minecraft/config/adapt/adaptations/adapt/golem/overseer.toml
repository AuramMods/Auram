# Adapt configuration - adaptation:adapt:golem/overseer
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Lets you signal your bound golems with the Artificer's Crook to follow you, hold, go home or work, and as it grows, to attack what you look at, answer by channel, rally to you and guard you in formation.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 2
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.5
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 1
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = ["adapt:golem/animus_binding@1"]
# Blocks from you within which your golems hear a Crook signal, by Overseer level from level 1 upward. Each value is clamped to 1-128.
# Effect: Higher values let signals reach golems farther away.
radiusByLevel = [16, 24, 32, 48, 64]
# Milliseconds after you send a signal before you can send another.
# Effect: Lower values let you send signals faster.
signalCooldownMillis = 1000
# Overseer level at which Sic joins the signal cycle and sends your fighting golems after the creature you look at.
# Effect: Lower values unlock Sic sooner.
sicLevel = 2
# Blocks, from 1 to 64, within which you must look at a creature to send Sic. Blocks in the way stop your look.
# Effect: Higher values let you point at creatures farther away.
sicRange = 24.0
# Seconds the creature you send Sic at glows for you alone. 0 turns the glow off.
# Effect: Higher values keep the target marked longer.
sicGlowSeconds = 5
# Seconds, at least 1, your golems keep attacking a Sic target before they choose their own targets again. They stop sooner when the target dies or leaves their world.
# Effect: Higher values keep golems on the target longer.
sicHoldSeconds = 20
# Overseer level at which the Crook channel set in the Golem Roster limits your signals to golems on that channel.
# Effect: Lower values unlock the Crook channel filter sooner.
channelFilterLevel = 3
# Overseer level at which a Follow signal also teleports your golems beyond the signal radius in the same world to you.
# Effect: Lower values unlock Rally sooner.
rallyLevel = 4
# Seconds after a Rally before Follow can rally golems again. While it cools down, Follow reaches only golems within the signal radius.
# Effect: Lower values let you rally golems more often.
rallyCooldownSeconds = 60
# Overseer level at which your following golems stand in a ring around you and give you armor.
# Effect: Lower values unlock Formation sooner.
formationLevel = 5
# Blocks from you, from 1 to 8, at which following golems stand in the formation ring.
# Effect: Higher values spread the ring wider.
formationRingRadius = 2.5
# Armor you gain for each following golem within formationArmorRange blocks of you.
# Effect: Higher values give more armor per golem.
formationArmorPerGolem = 1.0
# Most armor, from 0 to 30, the formation gives you.
# Effect: Higher values let larger formations protect you more.
formationArmorMax = 6.0
# Blocks from you within which a following golem counts toward your formation armor.
# Effect: Higher values count golems farther away.
formationArmorRange = 8.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.signal-feedback]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "CHIME_AND_PARTICLES"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["CHIME_AND_PARTICLES", "ACTION_BAR_ONLY"]

