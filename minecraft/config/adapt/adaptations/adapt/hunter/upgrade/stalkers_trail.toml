# Adapt configuration - adaptation:adapt:hunter/upgrade/stalkers_trail
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Wounded prey leaves a private trail, snares hold longer and catch animals alive, and precise kills drop more trophies.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Fraction of max health a target must fall to or below to leave a trail.
# Effect: Higher values start trails earlier in the fight.
woundHealthFraction = 0.5
# Blood trail duration before level scaling, in ticks.
# Effect: Higher values keep trails longer.
trailDurationTicksBase = 200
# Blood trail duration added per level, in ticks.
# Effect: Higher values reward higher levels more.
trailDurationTicksPerLevel = 100
# Distance a trail stays visible before level scaling, in blocks.
# Effect: Higher values let you track from farther away.
trackingRangeBase = 32.0
# Tracking distance added per level, in blocks.
# Effect: Higher values reward higher levels more.
trackingRangePerLevel = 8.0
# Most trails tracked at once on the server.
# Effect: Lower values reduce scheduling and particle work.
maxTrackedWounds = 64
# Thickness of each trail segment.
# Effect: Higher values make the trail easier to follow.
trailThickness = 0.06
# How long each trail segment stays, in ticks.
# Effect: Higher values leave a longer trail behind the prey.
displayDurationTicks = 30
# Silent skill XP when a new target starts bleeding.
# Effect: Higher values reward wounding prey.
xpPerWound = 3.0
# Snare root duration before level scaling, in ticks.
# Effect: Higher values hold snared mobs longer.
rootDurationTicksBase = 60
# Snare root duration added per level, in ticks.
# Effect: Higher values reward higher levels more.
rootDurationTicksPerLevel = 30
# Trigger charges per snare before level scaling.
# Effect: Higher values let one snare catch more mobs.
chargesBase = 4
# Trigger charges added per level.
# Effect: Higher values reward higher levels more.
chargesPerLevel = 1
# Snare trigger radius, in blocks.
# Effect: Higher values catch mobs from farther away.
triggerRadius = 1.6
# Slowness-equivalent amplifier of the root; each step removes 15% speed, up to a full stop.
# Effect: Higher values hold rooted mobs more firmly.
rootAmplifier = 6
# Milliseconds a snared mob cannot set off the same snare again after its root ends.
# Effect: Higher values spread charges across more mobs.
rearmBufferMillis = 500
# How long a placed snare lasts, in ticks.
# Effect: Higher values keep snares armed longer.
snareLifetimeTicks = 2400
# Most snares one player can keep placed.
# Effect: Lower values reduce tracked snare state.
maxSnaresPerPlayer = 4
# Most snares placed with this upgrade on the server.
# Effect: Lower values reduce scan work.
maxActiveSnares = 64
# Most mobs one snare roots per scan.
# Effect: Lower values reduce work in crowds.
maxTargetsPerScan = 8
# Skill XP for each mob snared.
# Effect: Higher values reward trapping.
xpPerSnare = 6.0
# Trophy chance on a precise kill before level scaling.
# Effect: Higher values drop trophies more often.
trophyChanceBase = 0.3
# Trophy chance added per level.
# Effect: Higher values reward higher levels more.
trophyChancePerLevel = 0.1
# Head chance on a precise kill before level scaling.
# Effect: Higher values drop heads more often.
headChanceBase = 0.04
# Head chance added per level.
# Effect: Higher values reward higher levels more.
headChancePerLevel = 0.03
# Trophy items per drop before level scaling.
# Effect: Higher values drop larger trophies.
trophyAmountBase = 2
# Trophy items added per level.
# Effect: Higher values reward higher levels more.
trophyAmountPerLevel = 1
# Shortest bow-kill distance that counts as precise before level scaling, in blocks.
# Effect: Lower values make ranged kills count sooner.
minimumRangeBase = 14.0
# Precise-kill distance removed per level, in blocks.
# Effect: Higher values make ranged precision easier at higher levels.
minimumRangePerLevel = 2.0
# Skill XP for each trophy drop.
# Effect: Higher values reward precise kills.
xpPerTrophy = 16.0
# How long a snare holds a caught animal at level 1, in ticks; it doubles each level.
# Effect: Higher values give you longer to reach your catch.
captureHoldTicksBase = 600
# Distance at which a caught animal is tied to you with a lead, in blocks.
# Effect: Higher values let you take a catch from farther away.
leadRange = 6.0
# Distance at which a led animal slips its lead, in blocks.
# Effect: Higher values let you lead faster or around more obstacles.
leadBreakRange = 12.0
# Most caught animals one player can hold or lead at once.
# Effect: Lower values limit herding.
maxCaptivesPerPlayer = 4

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.private-trail]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.require-sneak]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "OFF"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.trail-color]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "BLOOD"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["BLOOD", "WHITE", "CYAN", "GOLD"]

