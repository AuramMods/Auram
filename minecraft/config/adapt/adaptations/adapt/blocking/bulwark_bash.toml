# Adapt configuration - adaptation:adapt:blocking/bulwark_bash
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sprint, jump, and land a shielded crit to unleash a bash shockwave.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 3
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 2
# Adaptations the player must already have learned, each written as adaptationId@level; an id without a namespace is in this adaptation's namespace.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Controls Base damage for the adapt:blocking/bulwark_bash adaptation.
baseDamage = 1.0
# Controls Damage bonus base for the adapt:blocking/bulwark_bash adaptation.
damageBonusBase = 0.3
# Scaling applied to the adapt:blocking/bulwark_bash adaptation.
damageBonusFactor = 2.2
# Distance/area limit used by the adapt:blocking/bulwark_bash adaptation.
rangeBase = 2.4
# Scaling applied to the adapt:blocking/bulwark_bash adaptation.
rangeFactor = 1.8
# Controls Knockback base for the adapt:blocking/bulwark_bash adaptation.
knockbackBase = 0.6
# Scaling applied to the adapt:blocking/bulwark_bash adaptation.
knockbackFactor = 0.6
# Controls Upward knockback base for the adapt:blocking/bulwark_bash adaptation.
upwardKnockbackBase = 0.18
# Scaling applied to the adapt:blocking/bulwark_bash adaptation.
upwardKnockbackFactor = 0.14
# Duration or timing used by the adapt:blocking/bulwark_bash adaptation.
stunTicksBase = 18.0
# Scaling applied to the adapt:blocking/bulwark_bash adaptation.
stunTicksFactor = 24.0
# Controls Stun amplifier base for the adapt:blocking/bulwark_bash adaptation.
stunAmplifierBase = 2.0
# Scaling applied to the adapt:blocking/bulwark_bash adaptation.
stunAmplifierFactor = 1.0
# Cooldown between the adapt:blocking/bulwark_bash adaptation activations.
cooldownTicksBase = 220.0
# Cooldown between the adapt:blocking/bulwark_bash adaptation activations.
cooldownTicksFactor = 120.0
# Distance/area limit used by the adapt:blocking/bulwark_bash adaptation.
minFallDistanceForCrit = 0.08
# Duration or timing used by the adapt:blocking/bulwark_bash adaptation.
# Effect: Allows crit bash to trigger shortly after sprint momentum, even if sprint toggles off mid-air.
recentSprintWindowMillis = 900
# XP gain tuning for the adapt:blocking/bulwark_bash adaptation.
xpPerTargetHit = 8.0
# Maximum secondary living targets inspected by one bulwark bash.
# Effect: Lower values reduce dense-entity scheduling; values are clamped to an absolute maximum of 32.
maxCandidatesPerActivation = 16
# Maximum total targets affected by one bulwark bash, including the primary target.
# Effect: Lower values cap combat work and rewards in dense groups; values are clamped to an absolute maximum of 16.
maxAffectedPerActivation = 12
# Maximum affected targets that receive individual impact particles.
# Effect: Lower values reduce particle dispatch while preserving the main shockwave; values are clamped to an absolute maximum of 12.
maxTargetFxPerActivation = 6

