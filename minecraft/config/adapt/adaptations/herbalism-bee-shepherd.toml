# Adapt configuration - adaptation:herbalism-bee-shepherd
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Holding flowers near crops emits growth pulses and draws nearby bees toward you.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 2
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.5
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 1
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Controls Show growth particles for the herbalism-bee-shepherd adaptation.
showGrowthParticles = true
# Distance/area limit used by the herbalism-bee-shepherd adaptation.
radiusBase = 7.0
# Scaling applied to the herbalism-bee-shepherd adaptation.
radiusFactor = 12.0
# Controls Growth attempts base for the herbalism-bee-shepherd adaptation.
growthAttemptsBase = 10.0
# Scaling applied to the herbalism-bee-shepherd adaptation.
growthAttemptsFactor = 18.0
# Extra growth attempts granted per herded bee, as a fraction of the base attempts.
# Effect: Higher values make herding bees matter much more for each growth pulse.
growthBonusPerBee = 0.15
# Maximum number of herded bees that count toward the growth bonus.
# Effect: Higher values let large swarms keep increasing the growth bonus.
maxBonusBees = 5
# Controls Growth step base for the herbalism-bee-shepherd adaptation.
growthStepBase = 1.0
# Scaling applied to the herbalism-bee-shepherd adaptation.
growthStepFactor = 2.0
# Controls Food cost base for the herbalism-bee-shepherd adaptation.
foodCostBase = 1.0
# Scaling applied to the herbalism-bee-shepherd adaptation.
foodCostFactor = 1.2
# Duration or timing used by the herbalism-bee-shepherd adaptation.
pulseMillisBase = 900.0
# Scaling applied to the herbalism-bee-shepherd adaptation.
pulseMillisFactor = 650.0
# Controls Bee pull strength base for the herbalism-bee-shepherd adaptation.
beePullStrengthBase = 0.07
# Scaling applied to the herbalism-bee-shepherd adaptation.
beePullStrengthFactor = 0.14
# XP gain tuning for the herbalism-bee-shepherd adaptation.
xpPerGrowth = 0.9

