# Adapt configuration - adaptation:crafting-masterwork
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Each crafted tool and armor piece independently rolls variable bonus durability, a minor beneficial enchantment, and a full-level attribute bonus.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.4
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Chance to roll a masterwork piece at level 1.
# Effect: Higher values roll bonus durability more often at low levels.
rollChanceBase = 0.2
# Additional masterwork roll chance gained across levels.
# Effect: Higher values scale the roll chance more steeply.
rollChanceFactor = 0.55
# Maximum masterwork roll chance at full level.
# Effect: Higher values raise the ceiling on the roll chance.
rollChanceMax = 0.75
# Fraction of base durability granted as a bonus at level 1.
# Effect: Higher values grant more bonus durability even at low levels.
bonusPercentBase = 0.1
# Additional bonus durability fraction gained across levels.
# Effect: Higher values scale the durability bonus more steeply.
bonusPercentFactor = 0.4
# Minimum fraction of the level-scaled durability bonus rolled by a masterwork piece.
# Effect: Higher values make masterwork durability rolls more consistent and closer to their maximum.
bonusRollMinimumFraction = 0.5
# Chance for a masterwork piece to gain one compatible level-one beneficial enchantment.
# Effect: Higher values add minor beneficial enchantments to masterwork gear more often.
enchantmentChance = 0.1
# Chance for a minor attribute bonus at full level.
# Effect: Higher values roll the extra attribute bonus more often.
attributeChance = 0.15
# Attack damage granted by a masterwork tool attribute bonus.
# Effect: Higher values make masterwork tools hit harder.
attackDamageBonus = 1.0
# Armor granted by a masterwork armor attribute bonus.
# Effect: Higher values make masterwork armor more protective.
armorBonus = 1.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.attributes]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

