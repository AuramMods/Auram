# Adapt configuration - adaptation:crafting-backpacks
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Craft a Backpack that stores whole stacks and opens as its own container, in slot mode or bundle mode.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = true
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 1.0
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 1
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 2
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Backpack capacity. Only container representable sizes are valid: 9, 18, 27, 36, 45 and 54. Any other value snaps to the nearest valid size, and anything under 9 or over 54 clamps to 9 or 54. In slot mode this is the number of slots and every slot holds one ordinary stack, so 9 slots is 9 stacks. In bundle mode this is how many stacks worth of weight the backpack holds, using vanilla bundle weights where an item that stacks to 64 costs 1, an item that stacks to 16 costs 4, and an unstackable item costs 64.
# Effect: Higher values let one Backpack carry more; 9 opens as a 3x3 view and 54 opens as a double chest view.
slots = 9
# Storage mode a newly crafted Backpack starts in. SLOTS gives one ordinary stack per slot and always shows every stored stack in one view. BUNDLE gives vanilla bundle weight semantics with a paged projection of the stored stacks. Any other value falls back to SLOTS.
# Effect: Only affects Backpacks crafted after the change; existing Backpacks keep the mode they were crafted or cycled into.
defaultStorageMode = "SLOTS"
# Allows a player to switch a Backpack between slot mode and bundle mode by crafting it alone in a crafting grid. The Backpack has to be empty before it will switch.
# Effect: False locks every Backpack to the mode it was crafted in, so a server can force a single storage model.
allowModeToggle = true
# Maximum serialized size in bytes of the contents stored on one Backpack. Deposits that would push the stored data past this limit are refused, and anything already past it is handed back to the player instead of being dropped.
# Effect: Higher values allow deeper nested containers inside a Backpack at the cost of larger item data on disk.
maxStoredBytes = 262144
# Denies depositing a shulker box or a vanilla bundle that itself contains an Adapt Backpack. A Backpack can never be put directly inside another Backpack regardless of this setting.
# Effect: True blocks indirectly nested Backpacks entirely; false relies only on the stored size limit.
denyNestedContainers = true

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.mode-switch]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.storage]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "SERVER"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["SERVER", "SLOTS", "BUNDLE"]

