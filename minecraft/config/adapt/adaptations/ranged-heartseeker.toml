# Adapt configuration - adaptation:ranged-heartseeker
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Draw a bow while looking at a creature to lock on; the arrow curves to its mark, exits through targets, and carries Piercing and Ricochet Bolt passes onward.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 8
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Exclude passive and neutral mobs from target locks, automatic chains, and seeking-arrow damage.
# Effect: When enabled, normal unassisted arrow hits are unchanged.
ignorePassiveMobs = false
# Maximum distance at which drawing a bow can lock onto a creature.
# Effect: Higher values allow locking targets from further away.
lockRange = 32.0
# Milliseconds a lock stays valid after acquiring it; it never expires while the bow is still drawn.
# Effect: Higher values keep a lock longer after the player lowers the bow.
lockTimeoutMillis = 6000
# Maximum degrees the arrow turns toward its target per tick.
# Effect: Higher values make the curve tighter; lower values produce a broader natural arc.
turnDegreesPerTick = 10.0
# Maximum degrees the arrow turns per tick during its final approach.
# Effect: Higher values let close shots finish decisively without snapping directly at the target.
lungeTurnDegreesPerTick = 18.0
# Distance ahead of the shooter used as the control point for the initial launch arc.
# Effect: Higher values preserve the fired direction longer and create a wider opening arc.
initialArcControlDistance = 8.0
# Distance traveled before the initial launch arc hands full control to target homing.
# Effect: Higher values make the fired direction influence more of the opening flight.
initialArcDistance = 12.0
# Distance at which the arrow commits to a direct lunge at the target.
# Effect: Higher values commit to the final strike from further out.
lungeRadius = 2.5
# Maximum ticks a single seeking pass may fly before giving up.
# Effect: Higher values let arrows chase evasive targets longer.
maxFlightTicksPerPass = 160
# Radius searched for the next target after a target is lost or hit.
# Effect: Higher values let seeking arrows find targets further away.
reseekRadius = 12.0
# Ticks without closing distance before a seeking arrow retargets or gives up.
# Effect: Lower values make unreachable targets release the arrow sooner.
stuckTicks = 25
# Distance in blocks between trail particles along the arrow's flight path.
# Effect: Lower values draw a denser trail.
trailSpacing = 0.35
# Dust size of the seeking arrow's core trail particles.
# Effect: Higher values make the flight path more visible.
trailCoreSize = 1.6
# Maximum trail points emitted by one steering update.
# Effect: Higher values make long update gaps look more continuous but cost more particles.
maxTrailPointsPerUpdate = 20
# Maximum distance checked ahead for block avoidance.
# Effect: Higher values see obstacles sooner but trace through more of the world.
rayLookahead = 10.0
# Maximum alternate avoidance rays tested after the direct path is blocked.
# Effect: Higher values improve obstacle routing at additional ray-trace cost.
maxAvoidanceRays = 4
# Width of the avoidance cone used when the seeking path meets a block.
# Effect: Higher values turn farther around walls and pillars instead of grazing them.
avoidanceStrength = 1.15
# Steering updates that retain the selected route around an obstacle.
# Effect: Higher values reduce left-right oscillation around wide walls.
avoidanceHoldUpdates = 4
# Consecutive clear path checks required before releasing a remembered avoidance route.
# Effect: Higher values keep the arrow committed around corners for longer.
avoidanceClearChecks = 2
# Milliseconds between target-owner position snapshots.
# Effect: Lower values track moving targets more tightly while scheduling more target reads.
targetRefreshMillis = 50
# Maximum nearby entities inspected during one reseek.
# Effect: Higher values improve discovery in dense fights at additional collection cost.
maxCandidatesPerReseek = 24
# Maximum candidate-owner snapshot handoffs during one reseek.
# Effect: Higher values evaluate more targets at additional scheduler cost.
maxCandidateHandoffsPerReseek = 8
# Maximum chained seeking passes inherited from Piercing and Ricochet Bolt.
# Effect: Higher values allow longer chains while retaining a hard runtime ceiling.
maxChainPasses = 8
# Minimum distance a chained arrow travels beyond a struck target before it may turn toward the next mark.
# Effect: Higher values create more separation and prevent repeat passes from landing during damage immunity.
continuationExitDistance = 8.0
# Distance beyond the struck target's collision box where a chained arrow reappears.
# Effect: Higher values make the through-target exit more visible and reduce immediate repeat collisions.
continuationExitOffset = 0.35
# Bow item cooldown in ticks applied after a seeking shot at level 1.
# Effect: Higher values slow how often seeking shots can be fired at low levels.
cooldownTicksStart = 60
# Bow item cooldown in ticks applied after a seeking shot at max level.
# Effect: Higher values keep max-level seeking shots on a longer cooldown.
cooldownTicksEnd = 10
# XP granted when a seeking shot is admitted.
# Effect: Higher values accelerate skill progression from this adaptation.
xpPerSeek = 8.0
# XP granted per seeking arrow connection.
# Effect: Higher values reward landed seeking hits more.
xpPerHit = 4.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

