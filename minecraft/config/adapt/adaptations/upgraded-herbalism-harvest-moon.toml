# Adapt configuration - adaptation:upgraded-herbalism-harvest-moon
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Right-click a mature crop with a hoe to harvest and replant the whole field, with a chance of extra produce.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Field radius before level scaling, in blocks.
# Effect: Higher values sweep larger fields.
fieldRadiusBase = 4.0
# Field radius added per level, in blocks.
# Effect: Higher values widen the sweep at higher levels.
fieldRadiusPerLevel = 2.0
# Most blocks one sweep inspects.
# Effect: Lower values reduce work on huge fields.
fieldBlockBudget = 8192
# Bonus drop chance per crop before level scaling, in percent.
# Effect: Higher values make extra produce more common.
bonusChanceBase = 5.0
# Bonus drop chance per crop added per level, in percent.
# Effect: Higher values reward higher levels more.
bonusChancePerLevel = 5.0
# Hoe cooldown after a sweep, in ticks.
# Effect: Lower values allow sweeping more often.
cooldownTicks = 60
# Skill XP for each crop the sweep harvests.
# Effect: Higher values reward large fields.
xpPerCrop = 1.0
# Scarecrows a player may stand per level.
# Effect: Higher values let one player tend more fields.
scarecrowsPerLevel = 1
# Distance from a scarecrow to the edge of its square before level scaling, in blocks.
# Effect: Higher values give every scarecrow a larger square.
scarecrowHalfBase = 2
# Distance added to a scarecrow's square per level, in blocks.
# Effect: Higher values widen the square at higher levels.
scarecrowHalfPerLevel = 2
# Harvests a scarecrow makes before it wears out.
# Effect: Lower values make scarecrows need hay sooner.
scarecrowWearLimit = 2000
# Harvests one hay bale gives back to a worn scarecrow.
# Effect: Higher values make repairs cheaper.
scarecrowRepairPerHay = 250
# Most crops one scarecrow harvests per pass, every two seconds.
# Effect: Higher values clear ripe fields faster.
scarecrowHarvestsPerPass = 8
# How near the owner must be for a scarecrow to work, in blocks.
# Effect: Higher values keep distant fields tended.
scarecrowRange = 64.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.materials]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ALL"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ALL", "WHEAT", "CARROT", "POTATO", "BEETROOT", "MELON", "PUMPKIN", "NETHER", "FLOWERS", "FUNGI", "LEAVES", "BERRIES", "KELP"]

