# Adapt configuration - adaptation:upgraded-excavation-landshaper
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Dig a plane of soft ground at once, or a shaft down while sneaking, with haste while you dig; slam the ground and level it with Grading Stakes.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Blocks carved around each dug block before level scaling.
# Effect: Higher values clear more of the plane at low levels; the plane holds at most 8.
planeBlocksBase = 2
# Plane blocks added per level.
# Effect: Higher values reward higher levels more.
planeBlocksPerLevel = 2
# Shaft depth in blocks before level scaling.
# Effect: Higher values dig deeper shafts at every level.
shaftDepthBase = 4
# Shaft depth added per level, in blocks.
# Effect: Higher values reward higher levels more.
shaftDepthPerLevel = 4
# Time between two shafts, in milliseconds.
# Effect: Lower values allow more frequent shafts.
shaftCooldownMillis = 6000.0
# Ticks between two shaft blocks.
# Effect: Higher values dig the shaft more slowly.
ticksPerBlock = 2
# Blocks above the world floor where shafts stop.
# Effect: Higher values keep shafts farther from the bottom of the world.
safeFloorMargin = 16
# Shovel durability spent on each extra block.
# Effect: Higher values wear the shovel faster.
durabilityCostPerBlock = 1
# How long haste lasts after each dig, in ticks.
# Effect: Higher values keep haste through slower digs; clamped between 40 and 600.
hasteDurationTicks = 100
# Skill XP for each extra block carved.
# Effect: Higher values reward carving more.
xpPerBlock = 1.5
# Side of the area Grading Stakes level, in blocks, before level scaling.
# Effect: Higher values level larger areas at every level.
gradeSideBase = 4
# Side added to the graded area per level, in blocks.
# Effect: Higher values reward higher levels more.
gradeSidePerLevel = 4
# Most blocks the ground is raised or lowered at level 1.
# Effect: Higher values cut and fill deeper at every level.
gradeHeightAtFirstLevel = 3.0
# Height change added per level after the first, rounded down.
# Effect: Higher values reward higher levels more.
gradeHeightPerLevel = 2.5
# Ticks the outline shows before the ground is levelled.
# Effect: Higher values give more time to pull the stakes.
gradePreviewTicks = 60
# Blocks dug or filled per tick while grading.
# Effect: Higher values grade faster but cost more block updates per tick.
gradeBlocksPerTick = 8
# Most blocks one grade digs and fills together.
# Effect: Higher values allow deeper grades of the largest areas.
gradeMaxBlocks = 2048
# Length of the slam line in blocks.
# Effect: Higher values reach mobs farther ahead.
slamLength = 6
# Blocks to either side of the slam line that are still hit.
# Effect: Higher values make the line wider.
slamWidth = 1.25
# Blocks above or below you that the slam still hits.
# Effect: Higher values hit mobs on steeper ground.
slamHeight = 2.0
# Slam damage before level scaling.
# Effect: Higher values hit harder at every level.
slamDamageBase = 1.0
# Slam damage added per level.
# Effect: Higher values reward higher levels more.
slamDamagePerLevel = 2.0
# Time between slams before level scaling, in milliseconds.
# Effect: Lower values allow more frequent slams.
slamCooldownMillisBase = 12000.0
# Cooldown removed per level, in milliseconds.
# Effect: Higher values shorten the cooldown more at higher levels.
slamCooldownMillisPerLevel = 2000.0
# Shovel durability each slam costs.
# Effect: Higher values wear the shovel faster; a shovel that cannot pay does not slam.
slamDurability = 4
# Upward speed given to each mob the slam hits.
# Effect: Higher values throw mobs higher.
slamLift = 0.6
# Forward speed given to each mob the slam hits.
# Effect: Higher values push mobs farther away.
slamPush = 0.3
# How long slammed mobs are slowed, in ticks.
# Effect: Higher values keep them slowed longer.
slamSlowTicks = 60
# Slowness amplifier on slammed mobs (0 is Slowness I).
# Effect: Higher values slow them more.
slamSlowAmplifier = 1
# Skill XP for each natural mob the slam hits.
# Effect: Higher values reward slamming groups.
slamXpPerMob = 2.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

