# Adapt configuration - adaptation:stealth-speed
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Gain speed while sneaking, up to the vanilla sneak-speed cap of full walk speed.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Reference walk speed used to convert the speed bonus into a sneak-speed multiplier when the player's live walk speed is zero.
# Effect: Usually keep this at vanilla default unless another plugin changes baseline speeds globally.
baselineWalkSpeed = 0.2
# Maximum additional walk-speed-equivalent bonus granted at max level. The default lands max level exactly on the vanilla sneak-speed cap (sneaking at full walk speed).
# Effect: Higher values make stealth speed more noticeable, but the vanilla sneaking-speed clamp caps the effective boost at full walk speed.
maxSpeedBonus = 0.4666666666666667
# Multiplier applied to bonus speed while crawling on land.
# Effect: Higher values make crawling keep pace with sneaking.
crawlBonusMultiplier = 1.15
# Minimum walk-speed-equivalent clamp used when computing the sneak-speed multiplier.
# Effect: Keep near default to avoid unexpected slowdowns from conflicting systems.
minWalkSpeed = -1.0
# Maximum walk-speed-equivalent clamp used when computing the sneak-speed multiplier.
# Effect: Lower values cap how strong the sneak-speed boost can get.
maxWalkSpeed = 1.0
# Enables automatic vertical stepping while stealth speed is active.
# Effect: Helps smooth sneaking over one-block terrain changes.
enableAutoStep = true
# Grants extra step height for one-block ledges while stealth speed is active.
# Effect: Reduces sneak interruption when encountering small ledges.
enableAutoStepUp = true
# Extra step height granted while stealth speed is active and step-up is enabled.
# Effect: 0.4 raises the vanilla 0.6 step height to a full block.
stepHeightBonus = 0.4
# Allows stepping down one block while moving.
# Effect: Only steps down when the drop is exactly one block.
enableAutoStepDown = true
# Forward probe distance for auto-step-down checks.
# Effect: Higher values detect ledges earlier but can feel more aggressive.
autoStepProbeDistance = 0.45
# Horizontal push applied during each auto-step-down teleport.
# Effect: Higher values move farther off the next block and reduce repeat stepping in place.
autoStepForwardPush = 0.36
# Uses direct movement input for auto-step-down direction when available.
# Effect: Helps auto-step trigger while pressing toward ledges, even when velocity is near zero.
autoStepUseInput = true
# Minimum horizontal velocity required before auto-step-down runs.
# Effect: Higher values avoid accidental stepping while nearly idle.
autoStepVelocityThreshold = 0.01
# Minimum delay between auto-step-down teleports.
# Effect: Higher values reduce repeated stepping in tight terrain.
autoStepCooldownMs = 90
# Bounding-box height above which two-block headroom is required for step-down destinations.
# Effect: Lower values are stricter; higher values allow sneaking/crawling to step in tighter spaces.
doubleHeadroomHeightThreshold = 1.7
# Maximum bounding-box height counted as crawling on land.
# Effect: Higher values make crawl detection more permissive.
crawlHeightMax = 0.61
# Requires players to be grounded for stealth speed to run.
# Effect: True avoids midair acceleration and keeps behavior stable.
requireGrounded = true
# Allows stealth speed to run while the player is in water.
# Effect: False prevents stealth from overriding seaborne-style underwater movement effects.
allowWhileInWater = false
# Minimum horizontal velocity used to count the player as moving for FX/stat tracking.
# Effect: Higher values reduce effects while nearly stationary.
movementVelocityThreshold = 0.005
# Shows a subtle soul particle near the player's feet while stealth speed is active.
# Effect: Visual feedback visible only to the boosted player.
showSoulParticles = true
# Chance per tick to spawn a soul particle while moving.
# Effect: Higher values make the effect denser; lower values are subtler.
soulParticleChance = 0.3

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
