# Adapt configuration - adaptation:upgraded-seaborne-maelstrom
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Surge and jet from one charge pool; tridents hit harder, return the moment they strike, and call storms through the lent Storm Strike.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Charges shared by surge and jet at level 1.
# Effect: Higher values allow longer chains of rushes.
chargesBase = 3
# Charges added between level 1 and the top level.
# Effect: Higher values reward higher levels with more rushes.
chargesFactor = 3.0
# Time to regain one charge, in milliseconds.
# Effect: Lower values refill the pool faster.
chargeRegenMillis = 2000
# Jet force before level scaling.
# Effect: Higher values push each jet farther.
jetForceBase = 1.0
# Jet force added per level.
# Effect: Higher values widen the gap between levels.
jetForcePerLevel = 0.3
# Hunger exhaustion each jet costs.
# Effect: Higher values make jetting more tiring.
hungerCost = 1.5
# Surge strength before level scaling.
# Effect: Higher values make each surge faster.
surgeStrengthBase = 1.1
# Surge strength added per level.
# Effect: Higher values widen the gap between levels.
surgeStrengthPerLevel = 0.3
# Upward push added to each surge.
# Effect: Higher values lift surges toward the surface.
surgeLift = 0.04
# Fastest speed a surge can leave you with.
# Effect: Lower values are gentler on collisions.
maxSurgeVelocity = 2.4
# Distance ahead checked for walls before a surge, in blocks.
# Effect: Higher values refuse surges near walls sooner.
wallCheckDistance = 1.2
# Trident bonus damage at level 1, as a fraction.
# Effect: Higher values raise every trident hit.
tridentBonusBase = 0.3
# Trident bonus damage added between level 1 and the top level.
# Effect: Higher values reward higher levels more.
tridentBonusFactor = 0.4
# Speed of a returning trident at level 1.
# Effect: Higher values bring tridents back faster.
recallSpeedBase = 1.4
# Return speed added between level 1 and the top level.
# Effect: Higher values reward higher levels with faster returns.
recallSpeedFactor = 1.0
# Ticks a thrown trident flies before turning back when it hits nothing.
# Effect: Higher values let missed throws travel farther.
flightTicks = 30
# Ticks after a throw before the return checks start.
# Effect: Higher values delay every return.
recallDelayTicks = 1
# Skill XP for each trident hit.
# Effect: Higher values reward trident fighting.
xpPerTridentHit = 6.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

