# Adapt configuration - adaptation:excavation-earth-mover
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak-right-click the air with a shovel to damage, knock back, and slow hostile mobs with damage based on shovel tier.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.8
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 7
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Exclude passive and neutral mobs from area damage and its secondary effects.
# Effect: When enabled, protected mobs do not consume target limits. Direct attacks and player targeting are unchanged.
ignorePassiveMobs = false
# Distance/area limit used by the excavation-earth-mover adaptation.
radiusBase = 3.0
# Scaling applied to the excavation-earth-mover adaptation.
radiusFactor = 5.0
# Distance/area limit used by the excavation-earth-mover adaptation.
verticalRange = 3.0
# Controls Force base for the excavation-earth-mover adaptation.
forceBase = 0.6
# Scaling applied to the excavation-earth-mover adaptation.
forceFactor = 1.0
# Base multiplier applied to the held shovel's attack damage for Earth Mover.
# Effect: Higher values increase wave damage at every adaptation level.
damageMultiplierBase = 0.75
# Additional held-shovel damage multiplier gained across Earth Mover levels.
# Effect: Higher values make wave damage scale more strongly with adaptation level.
damageMultiplierFactor = 0.75
# Controls Lift velocity for the excavation-earth-mover adaptation.
liftVelocity = 0.35
# Duration or timing used by the excavation-earth-mover adaptation.
slowTicksBase = 40.0
# Scaling applied to the excavation-earth-mover adaptation.
slowTicksFactor = 60.0
# Controls Slow amplifier max for the excavation-earth-mover adaptation.
slowAmplifierMax = 2.0
# Cooldown between the excavation-earth-mover adaptation activations.
cooldownMillisBase = 16000.0
# Cooldown between the excavation-earth-mover adaptation activations.
cooldownMillisFactor = 8000.0
# Multiplier applied to Earth Mover cooldowns after level scaling.
# Effect: The default 0.5 halves the cooldown at every adaptation level.
cooldownScale = 0.5
# Hunger points consumed per earth wave.
# Effect: Higher values drain more food per wave; activation fails when food is below the cost. Set to 0 to disable the hunger cost.
hungerCost = 2
# XP gain tuning for the excavation-earth-mover adaptation.
xpPerMobHit = 6.0
# Maximum hostile mobs inspected by one earth wave.
# Effect: Lower values reduce dense-entity scheduling; values are clamped to an absolute maximum of 32.
maxCandidatesPerActivation = 16
# Maximum hostile mobs launched by one earth wave.
# Effect: Lower values cap combat work and rewards in dense farms; values are clamped to an absolute maximum of 16.
maxAffectedPerActivation = 12
# Maximum launched mobs that receive individual block-particle effects.
# Effect: Lower values reduce particle dispatch while preserving the main wave effect; values are clamped to an absolute maximum of 12.
maxTargetFxPerActivation = 8

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

