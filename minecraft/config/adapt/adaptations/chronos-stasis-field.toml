# Adapt configuration - adaptation:chronos-stasis-field
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak and right click with an amethyst shard to deploy a stasis bubble that freezes projectiles and locks down mobs inside.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Controls Play clock sounds for the chronos-stasis-field adaptation.
# Effect: True enables deployment and rejection sounds.
playClockSounds = true
# Consumes the amethyst shard used to deploy a stasis bubble.
# Effect: True makes each admitted cast cost one shard.
consumeShard = true
# Base radius of the stasis bubble in blocks.
# Effect: Higher values affect a larger area within the hard radius limit.
baseRadius = 3.5
# Extra bubble radius granted per adaptation level.
# Effect: Higher values make leveling expand the bubble faster.
radiusPerLevel = 0.75
# Base bubble lifetime in milliseconds.
# Effect: Higher values keep the bubble active longer within the hard duration limit.
baseDurationMillis = 3000
# Extra bubble lifetime in milliseconds per adaptation level.
# Effect: Higher values make leveling extend the bubble duration faster.
durationPerLevelMillis = 750
# Cooldown between bubble deployments in milliseconds.
# Effect: Higher values force longer waits between casts.
cooldownMillis = 20000
# Slowness amplifier applied to mobs inside the bubble.
# Effect: Higher values slow trapped mobs more severely within the supported effect range.
slownessAmplifier = 5
# Jump suppression amplifier applied to mobs inside the bubble as a jump_strength reduction scaling linearly from 0 (none) to -6 (full lock); positive values apply no modifier.
# Effect: More negative values suppress jumping more strongly; -6 or below locks jumping entirely.
jumpLockAmplifier = -6
# Duration in ticks of each refreshed stasis pulse.
# Effect: The runtime preserves enough buffering to cover the bounded pulse scheduler delay.
effectRefreshTicks = 20
# Milliseconds between bubble scans.
# Effect: Lower values refresh effects sooner within the supported pulse range.
pulseIntervalMillis = 250
# Removes frozen projectiles when the bubble expires instead of restoring their motion.
# Effect: True deletes trapped projectiles; false releases their buffered motion.
removeProjectilesOnExpire = false
# Milliseconds between bubble outline refreshes.
# Effect: Lower values redraw the outline more often within the global FX limit.
outlineRefreshMillis = 400
# XP granted when an admitted bubble is deployed.
# Effect: Higher values grant more skill XP per cast.
xpOnCast = 22.0
# Extra XP granted per adaptation level on an admitted cast.
# Effect: Higher values scale cast XP faster.
xpPerLevel = 3.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.clock-sounds]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.offhand-shard]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "OFF"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

