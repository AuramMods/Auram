# Adapt configuration - adaptation:tragoul-skeletal-servant
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak right-click with bones to raise a pack of temporary skeletal servants that gear up with your level, inherit your Tragoul perks, and hunt whatever you strike or whoever strikes you.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.75
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Bones consumed per summon before level scaling.
# Effect: Higher values make summoning more expensive at low levels.
boneCostBase = 8.0
# Bone cost reduction granted at max level.
# Effect: Higher values make summoning cheaper as the player levels.
boneCostReduction = 5.0
# Servant lifetime in ticks before level scaling.
# Effect: Higher values keep each servant alive longer.
durationTicksBase = 400.0
# Additional servant lifetime ticks granted at max level.
# Effect: Higher values increase the level-scaled lifetime growth.
durationTicksFactor = 800.0
# Summon cooldown in milliseconds before level scaling.
# Effect: Higher values slow how often a servant can be summoned.
cooldownMillisBase = 10000.0
# Cooldown reduction in milliseconds granted at max level.
# Effect: Higher values let high levels summon more often.
cooldownMillisFactor = 9000.0
# Living servants allowed per adaptation level, with a hard runtime ceiling of 16 per owner.
# Effect: Higher values let one necromancer field a larger pack up to the server-safety ceiling.
servantCapPerLevel = 1.0
# Replaces the oldest living servant when summoning at the cap.
# Effect: False quietly refuses the summon instead of recycling the oldest servant.
replaceOldestAtCap = true
# Window in milliseconds during which the entity the owner last hit or was hit by stays the pack's priority target.
# Effect: Higher values keep servants hunting the marked target for longer after the last combat event.
playerThreatWindowMillis = 5000
# Chance for each armor piece to be equipped on a freshly summoned servant.
# Effect: Higher values produce more heavily armored servants.
gearChancePerPiece = 0.55
# Base chance for an equipped piece to receive an enchantment at mid gear tiers.
# Effect: Higher values enchant servant gear more often before level scaling.
enchantChanceBase = 0.0
# Additional enchant chance granted at max level.
# Effect: Higher values make high-level servants spawn with enchanted gear more often.
enchantChanceFactor = 0.45
# Chance a servant spawns with a bow instead of a sword.
# Effect: Higher values produce more ranged servants.
bowChance = 0.3
# Bonus max health granted to servants per adaptation level.
# Effect: Higher values make servants tankier as the owner levels.
healthBonusPerLevel = 3.0
# Bonus attack damage granted to servants per adaptation level.
# Effect: Higher values make servants hit harder as the owner levels.
attackBonusPerLevel = 1.0
# Ticks between servant retarget pulses, clamped to at least 10 ticks.
# Effect: Lower values retarget faster but cannot exceed the server-safety cadence.
retargetIntervalTicks = 20
# Radius the servant scans for hostile mobs to attack, capped at 24 blocks.
# Effect: Higher values let the servant acquire targets further away up to the bounded search radius.
targetSearchRadius = 12.0
# XP granted per servant summon.
# Effect: Higher values accelerate skill progression from this adaptation.
xpPerSummon = 30.0
# Enables the owner max health upkeep while servants are alive.
# Effect: False lets the necromancer field servants with no health cost.
healthCostEnabled = true
# Max health removed from the owner per living servant.
# Effect: Higher values make maintaining a large pack of servants more punishing.
healthCostPerMinion = 2.0
# Lowest max health the servant upkeep can reduce the owner to.
# Effect: Higher values guarantee the owner keeps more health while servants are active.
minimumOwnerMaxHealth = 4.0
# Golemancy skill levels needed for each extra living servant on top of the level cap.
# Effect: Lower values give Golemancers extra servants sooner; 0 turns the bonus off.
golemancyCapBonusEveryLevels = 20
# Most extra living servants that Golemancy skill levels can add, still within the hard ceiling of 16 per owner.
# Effect: Higher values let high-level Golemancers field larger packs.
golemancyCapBonusMax = 2
# Fraction added to servant lifetime per Golemancy skill level. 0.01 is 1% longer per level.
# Effect: Higher values keep a Golemancer's servants alive longer.
golemancyDurationBonusPerLevel = 0.01
# Most extra servant lifetime that Golemancy skill levels can add, as a fraction. 0.5 is 50% longer.
# Effect: Higher values raise the lifetime ceiling for high-level Golemancers.
golemancyDurationBonusMax = 0.5

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.bone-reserve]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "NONE"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["NONE", "FOUR", "EIGHT"]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.replace-oldest]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.stance]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ASSIST"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ASSIST", "DEFEND", "PASSIVE"]

