# Adapt configuration - adaptation:axe-throwing-axe
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Left-click air with an axe to hurl it as a spinning projectile that deals its melee damage.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 3
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 4
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 2
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Exclude passive and neutral mobs from thrown axe impacts after a ricochet.
# Effect: When enabled, bounced axes cannot damage protected mobs. Direct throws and player targeting are unchanged.
ignorePassiveMobs = false
# Base fraction of the axe's melee damage dealt on a throw hit.
# Effect: Higher values make thrown axes hit harder at every level.
damageMultiplierBase = 0.6
# Extra melee-damage fraction added by leveling this adaptation.
# Effect: Higher values reward leveling with stronger throws.
damageMultiplierFactor = 0.6
# Base flight velocity of a thrown axe in blocks per tick.
# Effect: Higher values make thrown axes travel faster and flatter.
throwSpeedBase = 1.2
# Extra flight velocity added by leveling this adaptation.
# Effect: Higher values increase throw speed scaling with level.
throwSpeedFactor = 0.8
# Base throw cooldown in milliseconds before level scaling.
# Effect: Higher values slow how often axes can be thrown.
cooldownMsBase = 1200.0
# Milliseconds of cooldown removed at maximum level.
# Effect: Higher values let higher levels throw more frequently.
cooldownMsLevelReduction = 600.0
# Durability spent from the axe on each throw.
# Effect: Higher values wear thrown axes out faster.
durabilityCost = 3
# Ticks a thrown axe stays airborne before it is recovered automatically.
# Effect: Higher values let throws travel farther before auto-recovery.
maxFlightTicks = 80
# Level progress required before thrown axes return to your hand.
# Effect: Lower values unlock the auto-return at an earlier level.
returnUnlockLevelPercent = 1.0
# XP granted per thrown-axe hit on an entity.
# Effect: Higher values accelerate skill progression from throwing.
xpPerHit = 6.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.ignore-passive]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "OFF"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.require-sneak]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "OFF"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

