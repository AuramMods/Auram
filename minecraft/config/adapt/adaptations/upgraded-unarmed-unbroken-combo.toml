# Adapt configuration - adaptation:upgraded-unarmed-unbroken-combo
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Combo stacks survive being hit, each stack slows the target, and a sneaking hit at full stacks spends them all.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Most combo stacks before level scaling.
# Effect: Higher values allow longer combos.
maxStacksBase = 4
# Most combo stacks added per level.
# Effect: Higher values reward higher levels with longer combos.
maxStacksPerLevel = 2
# Bonus damage per stack before level scaling.
# Effect: Higher values make every stack hit harder.
damagePerStackBase = 0.4
# Bonus damage per stack added per level.
# Effect: Higher values reward higher levels more.
damagePerStackPerLevel = 0.15
# Time a combo survives without a hit before level scaling, in milliseconds. Being hit restarts it.
# Effect: Higher values keep combos alive between punches.
comboWindowMillisBase = 2200.0
# Combo window added per level, in milliseconds.
# Effect: Higher values keep combos alive longer at higher levels.
comboWindowMillisPerLevel = 400.0
# Time after the last hit before a missed swing drops the combo, in milliseconds.
# Effect: Higher values forgive more missed swings.
missResetGraceMillis = 280
# Highest slowness amplifier before adding the level.
# Effect: Higher values let long combos slow targets more.
maxSlownessAmplifierBase = 0
# Slowness duration per hit, in ticks.
# Effect: Higher values keep targets slowed for longer.
slownessDurationTicks = 60
# Skill XP per point of bonus damage.
# Effect: Higher values reward long combos.
xpPerBonusDamage = 4.0
# Finisher damage per stack spent before level scaling.
# Effect: Higher values make a full combo end harder.
finisherDamagePerStackBase = 0.5
# Finisher damage per stack spent added per level.
# Effect: Higher values reward higher levels more.
finisherDamagePerStackPerLevel = 0.3
# Highest Weakness amplifier a finisher applies; 0 is Weakness I.
# Effect: Higher values weaken finished targets more.
finisherWeaknessMaxAmplifier = 1
# Weakness duration after a finisher, in ticks.
# Effect: Higher values keep finished targets weak longer.
finisherWeaknessTicks = 100
# Time between finishers, in milliseconds.
# Effect: Higher values make finishers rarer.
finisherCooldownMillis = 8000
# Ticks before a mob can pick its dropped item up again.
# Effect: Higher values keep disarmed mobs empty-handed longer.
disarmPickupDelayTicks = 60

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

