# Adapt configuration - adaptation:upgraded-nether-brimstone
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Melee attackers ignite, fire damage feeds you, and explosions barely hurt.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Burn time set on a melee attacker before level scaling, in ticks.
# Effect: Higher values burn attackers longer.
igniteTicksBase = 60
# Burn time added per level, in ticks.
# Effect: Higher values reward higher levels more.
igniteTicksPerLevel = 30
# Skill XP for each attacker ignited.
# Effect: Higher values reward taking hits.
xpPerIgnite = 5.0
# Hunger restored by fire before level scaling.
# Effect: Higher values feed you more from each burn.
foodRestoreBase = 1.0
# Hunger restored by fire added per level.
# Effect: Higher values reward higher levels more.
foodRestorePerLevel = 1.0
# Saturation restored by fire.
# Effect: Higher values keep you full longer.
saturationRestore = 1.0
# Regeneration from fire before level scaling, in ticks.
# Effect: Higher values heal longer from each burn.
regenTicksBase = 40
# Regeneration added per level, in ticks.
# Effect: Higher values reward higher levels more.
regenTicksPerLevel = 20
# Regeneration amplifier at the maximum level; lower levels use amplifier 0.
# Effect: Higher values heal faster at the top level.
regenAmplifierAtMaxLevel = 1
# Time between two fire feedings before level scaling, in milliseconds.
# Effect: Lower values let fire feed you more often.
feedCooldownMillisBase = 2400.0
# Time between fire feedings removed per level, in milliseconds.
# Effect: Higher values make higher levels feed more often.
feedCooldownMillisPerLevel = 400.0
# Shortest time between two fire feedings at any level, in milliseconds.
# Effect: Lower values allow more frequent feeding.
minimumFeedCooldownMillis = 500.0
# Damage removed from explosions and ghast fireballs before level scaling.
# Effect: Higher values make blasts hurt less.
blastReductionBase = 0.5
# Blast damage reduction added per level.
# Effect: Higher values reward higher levels more.
blastReductionPerLevel = 0.1
# Highest blast damage reduction at any level.
# Effect: Caps the reduction.
maxBlastReduction = 0.85
# Longest burn left after a ghast fireball hit, in ticks.
# Effect: Lower values put out fireball burns faster.
maxFireTicksAfterFireball = 20
# Distance from a bartering piglin within which you broker its trade, in blocks.
# Effect: Higher values broker barters from further away.
brokerRange = 18.0
# Chance a barter gives one of its items again.
# Effect: Higher values make extra barter rolls more common.
barterExtraRollChance = 0.55
# Chance a barter adds a rare bonus item.
# Effect: Higher values make rare bonus items more common.
barterRareBonusChance = 0.23
# Size of an extra barter roll compared to the item it repeats.
# Effect: Higher values make extra rolls larger, up to a full stack.
barterAmountMultiplier = 1.5
# Time piglins may attack you after you hit one, open a container they guard or break their gold, in milliseconds.
# Effect: Higher values keep piglins hostile longer after you provoke them.
provokedMillis = 30000

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

