# Adapt configuration - adaptation:tame-fetch
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Your idle tamed wolves physically run to nearby dropped items, pick them up, and carry them back.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 3
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.4
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Distance/area limit used by the tame-fetch adaptation.
fetchRangeBase = 6.0
# Scaling applied to the tame-fetch adaptation.
fetchRangeFactor = 10.0
# Controls Carry rate base for the tame-fetch adaptation.
carryRateBase = 0.35
# Scaling applied to the tame-fetch adaptation.
carryRateFactor = 0.5
# Maximum cap applied to the tame-fetch adaptation.
maxCarryRate = 0.9
# Distance/area limit used by the tame-fetch adaptation.
wolfSearchRadius = 24.0
# Xp granted each time a wolf fetches a dropped item.
xpPerItemFetched = 4.0
# Maximum tamed wolves counted around the owner, capped internally at 12.
# Effect: Higher values let larger packs fetch more items per pass but scan more entities.
maxWolves = 6
# Maximum dropped items fetched per owner each pass, capped internally at 8.
# Effect: Lower values reduce item scheduling in dense drops.
maxCarryPerTick = 4
# Movement speed multiplier used while a wolf walks a fetch, clamped to 0.1 - 4.0.
# Effect: Higher values make the round trip finish sooner but look more frantic.
fetchWalkSpeed = 1.15
# Maximum physical fetch distance in blocks, clamped internally at 11 by vanilla pet follow behavior.
# Effect: Higher values let wolves claim more distant drops; drops beyond it remain where they are.
pathfindRadius = 9.0
# Milliseconds a walked fetch may run before it is given up, clamped to 1000 - 60000.
# Effect: Higher values let wolves keep working awkward routes instead of releasing the drop.
fetchDeadlineMillis = 9000
# Ticks between re-issuing a walking wolf its path, clamped to 1 - 20.
# Effect: Lower values hold the route tighter against vanilla goals but schedule more often.
maintenanceIntervalTicks = 5

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

[playerPreferences.fetch-collar]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ALL"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ALL", "RED", "BLUE", "YELLOW"]

[playerPreferences.items]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ALL"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ALL", "FOOD", "BLOCKS", "VALUABLES"]

