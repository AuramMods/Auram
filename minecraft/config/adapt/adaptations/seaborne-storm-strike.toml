# Adapt configuration - adaptation:seaborne-storm-strike
# This file is canonicalized on load; comments and new keys may update automatically.
#
# While rain falls on you or you are in water, your melee and trident hits call lightning on the first hit against each target and every few hits after it; thunderstorms strike harder and more often.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Lightning damage added to the hit at level 1.
# Effect: Higher values make every strike hit harder.
damageAtLevelOne = 3.0
# Lightning damage added to the hit at the top level.
# Effect: Higher values reward higher levels more.
damageAtTopLevel = 7.0
# Damage multiplier while you stand in a thunderstorm's rain.
# Effect: Higher values make thunderstorms more dangerous for your targets.
thunderDamageMultiplier = 1.5
# Hits on one target from one strike to the next at level 1; the first hit always strikes.
# Effect: Lower values strike more often.
strikeEveryAtLevelOne = 3
# Hits on one target from one strike to the next at the top level.
# Effect: Lower values strike more often at the top level.
strikeEveryAtTopLevel = 2
# Hits removed from the count in a thunderstorm.
# Effect: Higher values make thunderstorms strike more often.
thunderStrikeEveryReduction = 1
# Fewest hits from one strike to the next; never below 2.
# Effect: Higher values keep strikes from landing on back-to-back hits.
minimumStrikeEvery = 2
# Shortest time between two strikes on the same target, in milliseconds.
# Effect: Higher values limit strikes on one target.
targetStrikeGapMillis = 1500
# Shortest time between any two of your strikes, in milliseconds.
# Effect: Higher values limit strikes against crowds.
strikeGapMillis = 600
# Time a target is remembered after your last hit on it, in milliseconds; after that the next hit counts as the first again.
# Effect: Lower values let returning to a target strike again sooner.
targetMemoryMillis = 20000
# Seaborne XP for each strike on a natural mob; strikes on players pay none.
# Effect: Higher values level Seaborne faster in storms.
xpPerStrike = 4.0
# Whether strikes land on mobs that are not hostile, such as animals, villagers and mobs that only fight back.
# Effect: True lets lightning hit passive and neutral mobs.
strikePassiveMobs = false
# Whether strikes land on other players where PvP is allowed.
# Effect: True lets lightning hit players.
strikePlayers = false

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

