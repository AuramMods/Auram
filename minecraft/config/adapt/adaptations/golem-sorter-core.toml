# Adapt configuration - adaptation:golem-sorter-core
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Copper golems bound with a Sorter Core empty the container under an Input Node into nearby containers that already hold each item, and learn item groups, Filter Nodes, restocking and fetching as the core grows stronger.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.45
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 2
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = ["golem-node-weaving:1"]
# Blocks around an Input Node within which a Sorter puts items away, by Sorter Core level from level 1 upward. Each Input Node can narrow it in its menu. Values outside 1 to 64 load as the nearest limit.
# Effect: Higher values let Sorters serve containers farther from the Input Node.
destinationRadiusByLevel = [8, 12, 16, 20, 24]
# Item stacks a Sorter takes from a container on each trip, by Sorter Core level from level 1 upward. Its carry limit still applies. Values outside 1 to 64 load as the nearest limit.
# Effect: Higher values move more stacks per trip.
stacksPerTripByLevel = [1, 1, 2, 2, 4]
# Sorter Core level at which Sorters also put items into containers that hold another item of the same group.
# Effect: Lower values unlock item groups sooner.
groupsLevel = 2
# Item groups, written as name=members with members separated by commas. A member is an item name or #item_tag. An item that belongs to two groups counts for the first.
# Effect: Add a group to keep related items together, such as dyes or music discs.
groups = ["logs=#minecraft:logs", "planks=#minecraft:planks", "ores=#minecraft:coal_ores,#minecraft:iron_ores,#minecraft:copper_ores,#minecraft:gold_ores,#minecraft:redstone_ores,#minecraft:lapis_ores,#minecraft:diamond_ores,#minecraft:emerald_ores,NETHER_QUARTZ_ORE,NETHER_GOLD_ORE,ANCIENT_DEBRIS", "stone=STONE,COBBLESTONE,DEEPSLATE,COBBLED_DEEPSLATE,GRANITE,DIORITE,ANDESITE,TUFF,CALCITE,BLACKSTONE,BASALT,SMOOTH_BASALT,NETHERRACK,END_STONE", "wool=#minecraft:wool", "food=APPLE,BREAD,CARROT,POTATO,BAKED_POTATO,BEETROOT,MELON_SLICE,SWEET_BERRIES,GLOW_BERRIES,COOKIE,PUMPKIN_PIE,GOLDEN_CARROT,BEEF,COOKED_BEEF,PORKCHOP,COOKED_PORKCHOP,CHICKEN,COOKED_CHICKEN,MUTTON,COOKED_MUTTON,RABBIT,COOKED_RABBIT,COD,COOKED_COD,SALMON,COOKED_SALMON,DRIED_KELP", "redstone=REDSTONE,REDSTONE_TORCH,REPEATER,COMPARATOR,LEVER,PISTON,STICKY_PISTON,OBSERVER,HOPPER,DROPPER,DISPENSER,REDSTONE_LAMP,TARGET,DAYLIGHT_DETECTOR,TRIPWIRE_HOOK,STONE_PRESSURE_PLATE,STONE_BUTTON", "saplings=#minecraft:saplings", "seeds=WHEAT_SEEDS,BEETROOT_SEEDS,MELON_SEEDS,PUMPKIN_SEEDS,TORCHFLOWER_SEEDS,PITCHER_POD"]
# Sorter Core level at which Sorters use Filter Nodes, including overflow Filter Nodes, and the Filter Node recipe unlocks.
# Effect: Lower values unlock Filter Nodes sooner.
filterLevel = 3
# Sorter Core level at which Sorters tell enchanted books apart by their enchantments and potions and tipped arrows by their potion.
# Effect: Lower values unlock enchantment and potion matching sooner.
preciseLevel = 4
# Sorter Core level at which Sorters move shulker boxes, which they move whole with their contents.
# Effect: Lower values let Sorters move shulker boxes sooner.
shulkerBoxLevel = 4
# Sorter Core level at which Filter Nodes can set a restock amount that Sorters keep topped up.
# Effect: Lower values unlock restocking sooner.
restockLevel = 4
# Sorter Core level at which Sorters keep an index of the contents of the containers they serve instead of reading every container on each trip.
# Effect: Lower values unlock the index sooner.
indexLevel = 5
# Sorter Core level at which players can fetch items from the Input Node menu.
# Effect: Lower values unlock fetching sooner.
fetchLevel = 5
# Seconds an indexed container's contents are trusted before a Sorter reads the container again, from 1 to 3600. A player clicking in or closing the container, a hopper moving items in or out of it, or a Sorter working it refreshes it at once.
# Effect: Lower values read containers more often.
indexRefreshSeconds = 30
# Most containers the server keeps in the Sorter index at once, from 1 to 16384. The oldest entry is dropped when it is full.
# Effect: Higher values index more containers but use more memory.
maxIndexedContainers = 1024
# Seconds a fetch request waits for a Sorter before it is dropped, from 10 to 3600.
# Effect: Higher values keep fetch requests open longer.
fetchTimeoutSeconds = 120
# Most containers one Input Node serves, nearest first, from 1 to 1024. Containers beyond the limit are left alone.
# Effect: Higher values let one Input Node serve bigger storage rooms but read more containers.
maxServedContainers = 128
# Golemancy work XP paid for each item stack a Sorter puts away or brings to you. Values below 0 count as 0.
# Effect: Higher values pay more XP for sorting.
workXpPerStack = 0.3

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

# Settings for the golem-sorter-core adaptation Sorter core recipe section.
[sorterCoreRecipe]
# Crafting grid rows from top to bottom.
# Effect: Use 1 to 3 rows of the same width, at most 3 characters each. Each character is a symbol from keys; a space leaves that slot empty.
rows = [" X ", "YBY", " Z "]
# Item this recipe crafts.
# Effect: Accepts a material name such as SHIELD or a namespaced custom item such as namespace:item.
result = "golemancy:core/sorter"
# Number of result items one craft yields.
# Effect: Accepts 1 to 64.
amount = 1
# Registers this recipe.
# Effect: Set to false to remove the recipe from crafting.
enabled = true

# Ingredient for each row symbol.
# Effect: Accepts a material name such as AMETHYST_SHARD, an item tag such as #planks or #minecraft:planks, or a namespaced custom item such as namespace:item.
[sorterCoreRecipe.keys]
B = "golemancy:blank_core"
X = "COMPARATOR"
Y = "QUARTZ"
Z = "BARREL"

