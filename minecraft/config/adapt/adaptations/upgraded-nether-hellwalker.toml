# Adapt configuration - adaptation:upgraded-nether-hellwalker
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Stride over Nether lava, ignore fire, magma and campfires, and cross soul sand at full speed.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Lava stride push before level scaling.
# Effect: Higher values carry you further across lava with each stride.
strideBase = 0.45
# Lava stride push added per level.
# Effect: Higher values reward higher levels more.
stridePerLevel = 0.15
# Time between two lava strides before level scaling, in milliseconds.
# Effect: Lower values keep you moving more smoothly.
strideCooldownMillisBase = 500.0
# Time between strides removed per level, in milliseconds.
# Effect: Higher values make higher levels stride more often.
strideCooldownMillisPerLevel = 100.0
# Shortest time between two lava strides at any level, in milliseconds.
# Effect: Lower values allow faster lava crossings.
minimumStrideCooldownMillis = 150.0
# Hunger points each lava stride costs.
# Effect: Higher values make lava crossings drain food faster.
hungerPerStride = 1
# Fire resistance granted by each lava stride, in ticks.
# Effect: Higher values keep you safe longer after leaving the lava.
fireResistTicks = 100
# Movement speed bonus on soul sand and soul soil per level, as a fraction.
# Effect: Higher values make soul ground faster than normal ground.
soulSpeedBonusPerLevel = 0.1
# Water swim speed that lava swimming is measured against, in blocks per tick.
# Effect: Higher values make lava swimming faster at every level.
waterSwimSpeed = 0.2
# Share of water swim speed in lava before level scaling.
# Effect: Higher values swim faster through lava.
swimShareBase = 0.4
# Share of water swim speed added per level.
# Effect: Higher values reward higher levels more.
swimSharePerLevel = 0.2
# Time in lava that costs one hunger point, in milliseconds.
# Effect: Lower values make lava swims drain food faster.
lavaMillisPerHunger = 10000
# Level from which items you drop near lava float instead of burning.
# Effect: Higher values unlock floating items later.
itemFloatLevel = 2
# How long a dropped item floats in lava before it can burn, in ticks.
# Effect: Higher values give more time to pick items back up.
itemFloatTicks = 100

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

