# Adapt configuration - adaptation:seaborne-pressure-diver
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Gain absorption hearts and depth-scaling protection underwater while partially countering mining fatigue.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 4
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Required eye depth below sea level in blocks at the lowest adaptation level.
# Effect: Higher values require a deeper dive before any Pressure Diver buff activates.
depthThresholdBase = 10.0
# Blocks removed from the activation depth requirement across adaptation levels.
# Effect: Higher values let experienced divers activate the buff closer to the surface; the threshold floors at 2 blocks.
depthThresholdFactor = 6.0
# Required eye depth below sea level for the stronger Resistance tier at the lowest level.
# Effect: Higher values reserve Resistance II for deeper water.
deepThresholdBase = 18.0
# Blocks removed from the stronger Resistance tier requirement across levels.
# Effect: Higher values make the deep tier activate closer to the surface; the threshold floors at 4 blocks.
deepThresholdFactor = 8.0
# Incoming damage fraction removed while Pressure Diver is active at the lowest level.
# Effect: 0.12 removes 12% of incoming damage before the rolling Resistance effect is considered.
damageReductionBase = 0.12
# Additional incoming damage reduction gained across adaptation levels.
# Effect: Higher values scale the depth protection more strongly toward max level.
damageReductionFactor = 0.26
# Maximum incoming damage reduction fraction from Pressure Diver itself.
# Effect: Caps the direct reduction independently of the Resistance effect.
maxDamageReduction = 0.45
# Absorption health points granted when Pressure Diver activates at level 1; two health points display as one heart.
# Effect: Higher values give low-level divers more temporary bonus hearts without refilling consumed absorption during refreshes.
absorptionHealthBase = 4.0
# Additional absorption health points granted by maximum adaptation level.
# Effect: Higher values increase Pressure Diver's visible bonus-heart capacity as it levels.
absorptionHealthFactor = 8.0
# Lowest-level per-tick Mining Fatigue trim chance represented by the deterministic speed counter.
# Effect: Higher values offset more of Mining Fatigue II and above; Mining Fatigue I remains the floor.
fatigueTrimChanceBase = 0.2
# Additional Mining Fatigue trim chance gained across levels.
# Effect: Higher values make the submerged mining-speed counter stronger at higher levels.
fatigueTrimChanceFactor = 0.45
# Lowest-level Mining Fatigue amplifier steps trimmed by each conceptual proc.
# Effect: Higher values counter stronger Mining Fatigue more aggressively.
fatigueTrimAmountBase = 1.0
# Additional Mining Fatigue amplifier trim gained across levels.
# Effect: Higher values increase high-level fatigue suppression.
fatigueTrimAmountFactor = 1.0
# Duration in ticks of each refreshed Resistance effect.
# Effect: Higher values give more refresh tolerance; the runtime checks at least every 15 ticks while active.
effectTicks = 60
# Duration in ticks of each refreshed submerged mining-speed counter while Mining Fatigue is present.
# Effect: Higher values tolerate refresh delays; zero disables fatigue countering.
fatigueCounterDurationTicks = 80
# Seaborne XP granted on each active depth pulse.
# Effect: Higher values level Seaborne faster while Pressure Diver stays active.
xpPerDepthPulse = 6.0
# Minimum milliseconds between active-depth XP pulses.
# Effect: Higher values reduce XP frequency without changing the defensive buffs.
xpPulseCooldownMillis = 3000

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

