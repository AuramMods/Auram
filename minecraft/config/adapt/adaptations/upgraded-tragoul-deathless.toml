# Adapt configuration - adaptation:upgraded-tragoul-deathless
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Bones absorb heavy hits; a killing blow leaves you at 1 HP as your servants rise, and bones raise servants on demand.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Smallest hit, after armor, that spends a bone.
# Effect: Higher values save bones for real hits.
minDamageToAbsorb = 2.0
# Fraction of a hit a bone absorbs before level scaling.
# Effect: Higher values absorb more per bone.
absorbPercentBase = 0.25
# Absorbed fraction added per level.
# Effect: Higher values reward higher levels more.
absorbPercentPerLevel = 0.1
# Highest absorbed fraction at any level.
# Effect: Caps the absorption so hits always land.
maxAbsorbPercent = 0.65
# Time between two absorbed hits, in milliseconds.
# Effect: Higher values stop bursts from draining your bones.
absorbCooldownMillis = 2500.0
# Most living servants before level scaling, raised by the save and by hand together.
# Effect: Higher values field a larger guard.
servantsBase = 0
# Servants added to the cap per level.
# Effect: Higher values reward higher levels more.
servantsPerLevel = 1
# Servant lifetime in ticks before level scaling.
# Effect: Higher values keep servants longer.
servantTicksBase = 300
# Servant lifetime in ticks added per level.
# Effect: Higher values reward higher levels more.
servantTicksPerLevel = 300
# Bones spent for each servant raised by hand.
# Effect: Higher values make raising by hand cost more.
bonesPerServant = 4
# Health spent for each servant raised by hand, blood first; it never takes you below 1 HP.
# Effect: Higher values make raising by hand cost more life.
healthPerServant = 2.0
# Time between two servants raised by hand, in milliseconds.
# Effect: Higher values slow raising by hand.
raiseCooldownMillis = 1500.0
# Ticks you stay hidden and resistant after a defied killing blow.
# Effect: Higher values give your servants longer to cover you.
coverTicks = 60
# Resistance amplifier while hidden after a defied killing blow.
# Effect: Higher values reduce more damage while servants rise.
resistanceAmplifier = 3
# Radius in blocks in which mobs hunting you lose their target.
# Effect: Higher values shake off pursuers from farther away.
targetClearRadius = 12.0
# Death-save cooldown before level scaling, in milliseconds. Shared with Last Rites.
# Effect: Higher values make defying death rarer.
cooldownMillisBase = 420000.0
# Cooldown removed per level, in milliseconds.
# Effect: Higher values let higher levels defy death more often.
cooldownMillisPerLevel = 60000.0
# Shortest death-save cooldown at any level, in milliseconds.
# Effect: Lower values allow more frequent saves.
minimumCooldownMillis = 30000.0

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.bone-reserve]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "NONE"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["NONE", "FOUR", "EIGHT"]

[playerPreferences.death-save-priority]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "NORMAL"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["FIRST", "NORMAL", "LAST"]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

