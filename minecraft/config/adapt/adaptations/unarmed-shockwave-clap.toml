# Adapt configuration - adaptation:unarmed-shockwave-clap
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak and punch the air to clap a shockwave that knocks back enemies in a cone.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 6
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Base shockwave range in blocks at level 1.
# Effect: Higher values let the clap reach more distant enemies.
rangeBase = 3.5
# Additional shockwave range granted at max level.
# Effect: Higher values extend the clap reach as levels increase.
rangeFactor = 3.0
# Base knockback force at level 1.
# Effect: Higher values launch enemies further.
forceBase = 0.8
# Additional knockback force granted at max level.
# Effect: Higher values launch enemies further as levels increase.
forceFactor = 1.2
# Base upward knockback component at level 1.
# Effect: Higher values pop enemies into the air more.
upwardForceBase = 0.25
# Additional upward knockback granted at max level.
# Effect: Higher values pop enemies higher as levels increase.
upwardForceFactor = 0.2
# Look-direction dot threshold that defines the cone width.
# Effect: Lower values widen the cone; higher values narrow it.
coneDotThreshold = 0.45
# Base clap cooldown in milliseconds at level 1.
# Effect: Higher values make the ability usable less often.
cooldownMillisBase = 10000.0
# Cooldown reduction in milliseconds granted at max level.
# Effect: Higher values make the ability recharge faster as levels increase.
cooldownMillisFactor = 6000.0
# Hunger points consumed per shockwave clap.
# Effect: Higher values drain more food per clap; activation fails when food is below the cost. Set to 0 to disable the hunger cost.
hungerCost = 2
# XP granted per enemy knocked back by a clap.
# Effect: Higher values speed up unarmed skill progression from claps.
xpPerTargetHit = 14.0
# Maximum living targets inspected by one shockwave clap.
# Effect: Lower values reduce dense-entity scheduling; values are clamped to an absolute maximum of 32.
maxCandidatesPerActivation = 16
# Maximum living targets knocked back by one shockwave clap.
# Effect: Lower values cap combat work and rewards in dense groups; values are clamped to an absolute maximum of 16.
maxAffectedPerActivation = 12
# Maximum knocked-back targets that receive individual cloud particles.
# Effect: Lower values reduce particle dispatch while preserving the main shockwave; values are clamped to an absolute maximum of 12.
maxTargetFxPerActivation = 8

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.airborne-only]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "OFF"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

