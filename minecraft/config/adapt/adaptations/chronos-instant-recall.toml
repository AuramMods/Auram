# Adapt configuration - adaptation:chronos-instant-recall
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Click with a clock to rewind to a recent snapshot with health and hunger restored.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 3
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.45
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Controls Play clock sounds for the chronos-instant-recall adaptation.
playClockSounds = true
# Consumes one clock from the casting hand when a recall successfully starts.
# Effect: True makes each recall cost a clock; false keeps recalls item-free.
consumeClock = true
# Fraction of current health lost when a recall completes; never lethal, health is floored at 1.0.
# Effect: Higher values make recalls cost more health; 0 disables the health cost.
healthCostFraction = 0.5
# Controls Show rewind trace particles for the chronos-instant-recall adaptation.
showRewindTraceParticles = true
# Controls Rewind trace points for the chronos-instant-recall adaptation.
rewindTracePoints = 18
# Target rewind animation duration in milliseconds.
# Effect: Higher values make recall rewind visuals slower/smoother; lower values make them faster.
rewindAnimationDurationMillis = 1000
# Legacy fallback rewind animation ticks used when duration is invalid.
# Effect: Retained for backward compatibility with older configs.
rewindAnimationTicks = 18
# Temporarily switches to spectator during rewind animation for smoother camera movement through obstacles.
# Effect: True improves rewind smoothness; false keeps player in survival during rewind.
rewindUseTemporarySpectator = true
# Uses a client-side spectator camera anchor during rewind so server position only updates at the end.
# Effect: True reduces jitter and rubber-banding by avoiding per-tick player teleports.
rewindUseClientCamera = true
# Extra ticks to suppress teleport XP/stat tracking after recall rewinds.
# Effect: Higher values make it safer against teleport-XP side effects from other skills.
rewindTeleportXpSuppressExtraTicks = 10
# Enables direct click-with-clock activation for instant recall.
# Effect: True allows recall by clicking with a valid recall clock; false disables direct clock-click activation.
enableClockClickTrigger = true
# Allows left-click to activate recall when clock-click trigger is enabled.
# Effect: True allows left-click activation; false blocks left-click activation.
clockClickLeftClick = true
# Allows right-click to activate recall when clock-click trigger is enabled.
# Effect: True allows right-click activation; false blocks right-click activation.
clockClickRightClick = true
# Enables sprint + click activation for instant recall with a valid recall clock.
# Effect: True allows sprint-click activation; false disables sprint-click activation.
enableSprintClickTrigger = false
# Allows left-click for sprint-click recall trigger.
# Effect: True enables left-click sprint activation; false disables it.
sprintClickLeftClick = false
# Allows right-click for sprint-click recall trigger.
# Effect: True enables right-click sprint activation; false disables it.
sprintClickRightClick = true
# Allows click-in-air interactions for recall click triggers.
# Effect: True lets air-clicks activate enabled click modes; false blocks air-click activations.
allowAirClicks = true
# Allows click-on-block interactions for recall click triggers.
# Effect: True lets block-clicks activate enabled click modes; false blocks block-click activations.
allowBlockClicks = true
# Enables single-sneak activation for instant recall.
# Effect: True allows pressing sneak once to trigger recall.
enableSingleSneakTrigger = false
# Require sprinting for single-sneak instant recall trigger.
# Effect: True requires sprint state when using single-sneak activation.
singleSneakRequiresSprint = false
# Require holding a valid recall clock in either hand for single-sneak trigger.
# Effect: True keeps single-sneak recall tied to clock usage.
singleSneakRequiresClockInHand = true
# Enables double-tap jump activation for instant recall.
# Effect: True allows jump-based recall trigger; false disables jump trigger.
enableDoubleJumpTrigger = false
# Require sprinting while double-jumping to trigger recall.
# Effect: True requires sprint state for double-jump trigger; false allows it without sprint.
doubleJumpRequiresSprint = false
# Require holding a valid recall clock in either hand for double-jump trigger.
# Effect: True requires clock-in-hand for jump trigger; false allows jump trigger without holding a clock.
doubleJumpRequiresClockInHand = true
# Controls Base rewind seconds for the chronos-instant-recall adaptation.
baseRewindSeconds = 3.5
# Controls Rewind seconds per level for the chronos-instant-recall adaptation.
rewindSecondsPerLevel = 0.35
# Hard cap for recall rewind duration in seconds.
# Effect: Prevents high levels/config values from exceeding this rewind window.
maxRewindSeconds = 5.0
# Cooldown between the chronos-instant-recall adaptation activations.
cooldownPaddingSeconds = 1
# Duration or timing used by the chronos-instant-recall adaptation.
snapshotIntervalMillis = 50
# Controls History padding seconds for the chronos-instant-recall adaptation.
historyPaddingSeconds = 2
# Duration or timing used by the chronos-instant-recall adaptation.
rewindProtectionTicks = 25
# XP gain tuning for the chronos-instant-recall adaptation.
xpPerDistanceBlock = 0.35
# XP gain tuning for the chronos-instant-recall adaptation.
xpPerHealthPoint = 0.85
# XP gain tuning for the chronos-instant-recall adaptation.
xpPerHungerPoint = 0.7
# XP gain tuning for the chronos-instant-recall adaptation.
xpPerSaturationPoint = 0.18
# XP gain tuning for the chronos-instant-recall adaptation.
xpLevelMultiplierPerLevel = 0.08
# XP gain tuning for the chronos-instant-recall adaptation.
xpMinRawReward = 1.35
# XP gain tuning for the chronos-instant-recall adaptation.
xpMinAward = 0.5
# XP gain tuning for the chronos-instant-recall adaptation.
xpMaxAward = 36.0
# XP gain tuning for the chronos-instant-recall adaptation.
xpCrossWorldDistanceCredit = 16.0
# XP gain tuning for the chronos-instant-recall adaptation.
xpDiminishWindowMillis = 45000
# XP gain tuning for the chronos-instant-recall adaptation.
xpDiminishMinMultiplier = 0.18
# XP gain tuning for the chronos-instant-recall adaptation.
xpRepeatWindowMillis = 180000
# XP gain tuning for the chronos-instant-recall adaptation.
xpRepeatSourceRadius = 3.5
# XP gain tuning for the chronos-instant-recall adaptation.
xpRepeatTargetRadius = 3.5
# XP gain tuning for the chronos-instant-recall adaptation.
xpRepeatPenaltyMultiplier = 0.2

