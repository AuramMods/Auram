# Adapt configuration - adaptation:herbalism-compost-cascade
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak-right-click a composter to consume nearby drops, harvest and replant mature crops, compost your inventory, and spend the compost maturing nearby crops.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.72
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 6
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Allows the cascade to break and compost nearby leaf blocks.
# Effect: True lets the cascade strip leaves inside its radius; false leaves trees untouched.
consumeLeaves = false
# Distance/area limit used by the herbalism-compost-cascade adaptation.
radiusBase = 5.0
# Scaling applied to the herbalism-compost-cascade adaptation.
radiusFactor = 12.0
# Maximum cap applied to the herbalism-compost-cascade adaptation.
maxItemsBase = 80.0
# Scaling applied to the herbalism-compost-cascade adaptation.
maxItemsFactor = 240.0
# Chance for the herbalism-compost-cascade adaptation to trigger.
fillChanceBase = 0.5
# Chance for the herbalism-compost-cascade adaptation to trigger.
fillChanceFactor = 0.42
# Chance for the herbalism-compost-cascade adaptation to trigger.
maxFillChance = 0.98
# Controls Leaf compost bursts base for the herbalism-compost-cascade adaptation.
leafCompostBurstsBase = 3.0
# Scaling applied to the herbalism-compost-cascade adaptation.
leafCompostBurstsFactor = 9.0
# Chance for the herbalism-compost-cascade adaptation to trigger.
leafFillChanceMultiplierBase = 1.35
# Chance for the herbalism-compost-cascade adaptation to trigger.
leafFillChanceMultiplierFactor = 0.7
# Cooldown between the herbalism-compost-cascade adaptation activations.
cooldownTicksBase = 36.0
# Cooldown between the herbalism-compost-cascade adaptation activations.
cooldownTicksReduction = 28.0
# Controls Bone meal base for the herbalism-compost-cascade adaptation.
boneMealBase = 2.0
# Scaling applied to the herbalism-compost-cascade adaptation.
boneMealFactor = 6.0
# Controls Ready bonus bone meal base for the herbalism-compost-cascade adaptation.
readyBonusBoneMealBase = 2.0
# Scaling applied to the herbalism-compost-cascade adaptation.
readyBonusBoneMealFactor = 8.0
# Controls Items per bone meal base for the herbalism-compost-cascade adaptation.
itemsPerBoneMealBase = 20.0
# Controls Items per bone meal reduction for the herbalism-compost-cascade adaptation.
itemsPerBoneMealReduction = 14.0
# Compost fills wasted on a full composter that are worth one extra bone meal.
# Effect: Lower values convert overflow compost into bone meal faster; higher values waste more of it.
overflowFillsPerBoneMeal = 4.0
# Crop maturation attempts granted at level one.
# Effect: Higher values let a single cascade push more nearby crops one growth stage forward.
maturationAttemptsBase = 6.0
# Additional crop maturation attempts granted per adaptation level above one.
# Effect: Higher values make each level mature noticeably more crops per cascade.
maturationAttemptsPerLevel = 6.0
# Chance for the herbalism-compost-cascade adaptation to trigger.
valuableChanceBase = 0.01
# Chance for the herbalism-compost-cascade adaptation to trigger.
valuableChanceFactor = 0.09
# Chance for the herbalism-compost-cascade adaptation to trigger.
maxValuableChance = 0.12
# Controls Valuable rolls base for the herbalism-compost-cascade adaptation.
valuableRollsBase = 1.0
# Scaling applied to the herbalism-compost-cascade adaptation.
valuableRollsFactor = 3.0
# XP gain tuning for the herbalism-compost-cascade adaptation.
xpPerItemConsumed = 1.2
# XP gain tuning for the herbalism-compost-cascade adaptation.
xpPerLevelGain = 2.8
# Experience granted for every nearby crop the cascade matures.
# Effect: Higher values reward the maturation phase more heavily.
xpPerCropMatured = 2.0

