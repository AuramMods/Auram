# Adapt configuration - adaptation:pickaxe-quarry-sense
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak-right-click a block with an iron+ pickaxe to reveal nearby ores as private glowing block displays.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Controls Costs reduce max durability for the pickaxe-quarry-sense adaptation.
# Effect: True reduces max durability instead of adding normal damage.
costsReduceMaxDurability = false
# Distance/area limit used by the pickaxe-quarry-sense adaptation.
scanRadiusBase = 10.0
# Scaling applied to the pickaxe-quarry-sense adaptation.
scanRadiusFactor = 18.0
# Maximum world block checks made by one Quarry Sense activation.
# Effect: Higher values improve ore detection but increase total budgeted scan work; values above the hard safety cap are clamped.
maxBlockChecks = 2048
# Radius searched completely before the remaining Quarry Sense budget is spread across the full range.
# Effect: Higher values prioritize nearby accuracy; lower values reserve more samples for distant ore.
denseScanRadius = 6
# Maximum cap applied to the pickaxe-quarry-sense adaptation.
maxHighlightsBase = 6.0
# Scaling applied to the pickaxe-quarry-sense adaptation.
maxHighlightsFactor = 10.0
# Duration or timing used by the pickaxe-quarry-sense adaptation.
highlightTicksBase = 90.0
# Scaling applied to the pickaxe-quarry-sense adaptation.
highlightTicksFactor = 90.0
# Cooldown between the pickaxe-quarry-sense adaptation activations.
cooldownTicksBase = 60.0
# Cooldown between the pickaxe-quarry-sense adaptation activations.
cooldownTicksFactor = 40.0
# Controls Durability cost percent base for the pickaxe-quarry-sense adaptation.
durabilityCostPercentBase = 0.006
# Scaling applied to the pickaxe-quarry-sense adaptation.
durabilityCostPercentFactor = 0.0045
# Minimum threshold required for the pickaxe-quarry-sense adaptation.
minDurabilityCostPercent = 0.001
# XP gain tuning for the pickaxe-quarry-sense adaptation.
xpPerFoundOre = 6.0

