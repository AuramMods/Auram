# Adapt configuration - adaptation:herbalism-hungry-shield
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Take damage to your hunger before your health, covering more damage types as the adaptation levels up.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 5
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.6
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 3
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Controls Effectiveness base for the herbalism-hungry-shield adaptation.
effectivenessBase = 0.15
# Maximum cap applied to the herbalism-hungry-shield adaptation.
maxEffectiveness = 0.95
# Level required before contact, cramming, drowning, suffocation, wall, magma and freeze damage are shielded.
# Effect: Higher values delay when the basic damage types become shielded.
basicsUnlockLevel = 1
# Level required before melee, sweep and thorns damage is shielded.
# Effect: Higher values delay when melee damage becomes shielded.
meleeUnlockLevel = 2
# Level required before fire, lava and campfire damage is shielded.
# Effect: Higher values delay when burning damage becomes shielded.
fireUnlockLevel = 3
# Level required before projectile, explosion, falling block and lightning damage is shielded.
# Effect: Higher values delay when burst damage becomes shielded.
burstUnlockLevel = 4
# Level required before magic, poison, wither, dragon breath and sonic boom damage is shielded.
# Effect: Higher values delay when magical damage becomes shielded.
magicUnlockLevel = 5
# Milliseconds between hunger charges for damage-over-time sources such as fire, lava, poison and drowning.
# Effect: Higher values let more damage-over-time ticks through unshielded but drain hunger far slower.
dotChargeIntervalMs = 1000

