# Adapt configuration - adaptation:golem-breaker-core
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Golems bound with a Breaker Core break the blocks a Breaker Node's filter lists inside its area and carry the drops, mining harder blocks with better pickaxes as the core grows stronger.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.45
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 2
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = ["golem-node-weaving:1"]
# Ticks a Breaker spends on each block after it reaches it, by Breaker Core level from level 1 upward. Swiftness runes shorten it. Values below 1 count as 1.
# Effect: Lower values make Breakers mine faster.
intervalTicksByLevel = [40, 30, 20, 15, 10]
# Hardest block a Breaker breaks, by Breaker Core level from level 1 upward. Stone is 1.5, cobblestone 2, deepslate 3 and obsidian 50.
# Effect: Higher values let Breakers mine harder blocks sooner.
maxHardnessByLevel = [2.0, 3.0, 5.0, 10.0, 50.0]
# Best pickaxe tier a Breaker may mine with, by item name and Breaker Core level from level 1 upward. Up to an iron pickaxe it mines without a tool, and drops are rolled as if that pickaxe broke the block. Blocks that need a better pickaxe, such as obsidian, are broken only while the Breaker holds a pickaxe of that tier from its home chest, which wears with each of those breaks. Blocks this tier cannot harvest are left alone. Names that are not a pickaxe use the default pickaxe for that level, with a warning.
# Effect: Better tiers let Breakers harvest more blocks, such as diamond ore with an iron pickaxe or obsidian with a diamond pickaxe from the home chest.
toolByLevel = ["STONE_PICKAXE", "IRON_PICKAXE", "IRON_PICKAXE", "DIAMOND_PICKAXE", "NETHERITE_PICKAXE"]
# Breaker Core level at which Breaker Nodes can turn on Silk Touch. A Breaker mines blocks whole only while it holds a Silk Touch pickaxe from its home chest, which wears with each of those breaks.
# Effect: Lower values unlock Silk Touch sooner.
silkTouchLevel = 3
# Breaker Core level at which Breaker Nodes can turn on Fortune, which raises ore drops at the Fortune level of the pickaxe the Breaker holds from its home chest. Without a Fortune pickaxe no Fortune applies. Silk Touch and Fortune never apply together.
# Effect: Lower values unlock Fortune sooner.
fortuneLevel = 5
# Blocks Breakers never break, by block name or #block_tag. Breakers also never break blocks with a block entity, such as chests, furnaces, signs and spawners, the block under any node, or the blocks of an Animus Plinth.
# Effect: Add a block or tag to protect it from Breakers.
blacklist = ["BEDROCK", "BARRIER", "COMMAND_BLOCK", "CHAIN_COMMAND_BLOCK", "REPEATING_COMMAND_BLOCK", "STRUCTURE_BLOCK", "STRUCTURE_VOID", "JIGSAW", "SPAWNER", "TRIAL_SPAWNER", "VAULT", "END_PORTAL_FRAME", "REINFORCED_DEEPSLATE", "BUDDING_AMETHYST", "#beds", "#doors"]
# Golemancy work XP paid for each block a Breaker breaks. Values below 0 count as 0.
# Effect: Higher values pay more XP for mining.
workXpPerBlock = 0.4

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

# Settings for the golem-breaker-core adaptation Breaker core recipe section.
[breakerCoreRecipe]
# Crafting grid rows from top to bottom.
# Effect: Use 1 to 3 rows of the same width, at most 3 characters each. Each character is a symbol from keys; a space leaves that slot empty.
rows = [" X ", "YBY", " Z "]
# Item this recipe crafts.
# Effect: Accepts a material name such as SHIELD or a namespaced custom item such as namespace:item.
result = "golemancy:core/breaker"
# Number of result items one craft yields.
# Effect: Accepts 1 to 64.
amount = 1
# Registers this recipe.
# Effect: Set to false to remove the recipe from crafting.
enabled = true

# Ingredient for each row symbol.
# Effect: Accepts a material name such as AMETHYST_SHARD, an item tag such as #planks or #minecraft:planks, or a namespaced custom item such as namespace:item.
[breakerCoreRecipe.keys]
B = "golemancy:blank_core"
X = "IRON_PICKAXE"
Y = "REDSTONE"
Z = "PISTON"

# Settings for the golem-breaker-core adaptation Breaker node recipe section.
[breakerNodeRecipe]
# Crafting grid rows from top to bottom.
# Effect: Use 1 to 3 rows of the same width, at most 3 characters each. Each character is a symbol from keys; a space leaves that slot empty.
rows = [" X ", " B ", "   "]
# Item this recipe crafts.
# Effect: Accepts a material name such as SHIELD or a namespaced custom item such as namespace:item.
result = "golemancy:node/breaker"
# Number of result items one craft yields.
# Effect: Accepts 1 to 64.
amount = 1
# Registers this recipe.
# Effect: Set to false to remove the recipe from crafting.
enabled = true

# Ingredient for each row symbol.
# Effect: Accepts a material name such as AMETHYST_SHARD, an item tag such as #planks or #minecraft:planks, or a namespaced custom item such as namespace:item.
[breakerNodeRecipe.keys]
B = "golemancy:blank_node"
X = "IRON_PICKAXE"

