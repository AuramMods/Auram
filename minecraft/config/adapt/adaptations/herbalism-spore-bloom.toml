# Adapt configuration - adaptation:herbalism-spore-bloom
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Sneak-right-click mycelium with mushrooms to spread an outward spore-web that mutates nearby growth.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 4
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 5
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 4
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Allows flowers hit by the bloom to be replaced with mushrooms.
# Effect: Disable this to keep flowers untouched while still converting soil into mushroom blocks.
swapFlowersToMushrooms = true
# Controls Bloom attempts base for the herbalism-spore-bloom adaptation.
bloomAttemptsBase = 26.0
# Scaling applied to the herbalism-spore-bloom adaptation.
bloomAttemptsFactor = 58.0
# Additional bloom attempts granted each adaptation level.
# Effect: Higher values make each level spread across more total blocks.
bloomAttemptsPerLevel = 12.0
# Mushrooms consumed by a level one bloom.
# Effect: Higher values make every bloom cost more mushrooms.
sporeCostBase = 1.0
# Additional mushrooms consumed per adaptation level above one.
# Effect: Higher values make larger blooms cost proportionally more mushrooms.
sporeCostPerLevel = 1.0
# Distance/area limit used by the herbalism-spore-bloom adaptation.
bloomRadiusBase = 5.0
# Scaling applied to the herbalism-spore-bloom adaptation.
bloomRadiusFactor = 10.0
# Controls Spokes base for the herbalism-spore-bloom adaptation.
spokesBase = 6.0
# Scaling applied to the herbalism-spore-bloom adaptation.
spokesFactor = 7.0
# Controls Blocks per pulse base for the herbalism-spore-bloom adaptation.
blocksPerPulseBase = 2.0
# Scaling applied to the herbalism-spore-bloom adaptation.
blocksPerPulseFactor = 4.0
# Duration or timing used by the herbalism-spore-bloom adaptation.
spreadIntervalTicksBase = 3.0
# Scaling applied to the herbalism-spore-bloom adaptation.
spreadIntervalTicksFactor = 1.6
# Controls Food cost base for the herbalism-spore-bloom adaptation.
foodCostBase = 2.0
# Scaling applied to the herbalism-spore-bloom adaptation.
foodCostFactor = 1.2
# Cooldown between the herbalism-spore-bloom adaptation activations.
cooldownMillisBase = 1700.0
# Cooldown between the herbalism-spore-bloom adaptation activations.
cooldownMillisFactor = 1100.0
# XP gain tuning for the herbalism-spore-bloom adaptation.
xpPerMushroomPlaced = 1.4

