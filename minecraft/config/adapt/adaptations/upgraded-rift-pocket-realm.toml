# Adapt configuration - adaptation:upgraded-rift-pocket-realm
# This file is canonicalized on load; comments and new keys may update automatically.
#
# Open your ender chest anywhere, pull nearby drops into it, refill placed blocks from it, and travel and send items between Rift Anchors.

# Enables or disables this feature.
# Effect: Set to false to disable behavior without uninstalling files.
enabled = true
# Prevents normal player unlearning after this adaptation is purchased.
# Effect: The first purchase still uses the configured cost and confirmation; administrative bypass may lower it without a refund.
permanent = false
# Shows the particle effects for this adaptation.
showParticles = true
# Plays the sound effects for this adaptation.
showSounds = true
# Base knowledge cost used when learning this adaptation.
# Effect: Higher values make each level cost more knowledge.
baseCost = 6
# Scaling factor applied to higher adaptation levels.
# Effect: Higher values increase level-to-level cost growth.
costFactor = 0.7
# Maximum level a player can reach for this adaptation.
# Effect: Higher values allow more levels; lower values cap progression sooner.
maxLevel = 3
# Knowledge cost required to purchase level 1.
# Effect: Higher values make unlocking the first level more expensive.
initialCost = 5
# Adaptations the player must already have learned, each written as adaptationId:level.
# Effect: Learning or leveling this adaptation is refused until every listed adaptation is learned at that level, and those adaptations cannot be unlearned below it while this one is learned.
requires = []
# Time between two ender chest openings, in milliseconds.
# Effect: Lower values allow reopening sooner.
openCooldownMillis = 1000
# Drop pull radius before level scaling, in blocks.
# Effect: Higher values pull drops from farther; capped at 16.
pullRadiusBase = 6.0
# Drop pull radius added per level, in blocks.
# Effect: Higher values reward higher levels more.
pullRadiusPerLevel = 2.0
# Separate drops pulled per pulse before level scaling.
# Effect: Higher values clear more drops at once; capped at 32.
pullItemsBase = 12.0
# Separate drops pulled per pulse added per level.
# Effect: Higher values reward higher levels more.
pullItemsPerLevel = 6.0
# Ticks between two pull pulses.
# Effect: Lower values pull more often.
pullPulseTicks = 10
# Most blocks moved into your hand after each placement.
# Effect: Higher values refill fuller stacks.
refillAmount = 64
# Rift Anchors a player may place before level scaling.
# Effect: Higher values allow more anchors; capped at 16.
anchorsBase = 1
# Rift Anchors added per level.
# Effect: Higher values reward higher levels more.
anchorsPerLevel = 1
# Channel before an anchor trip, before level scaling, in milliseconds.
# Effect: Higher values make every trip slower.
channelMillisBase = 3500
# Channel time taken off per level, in milliseconds.
# Effect: Higher values make high-level trips faster; never below half a second.
channelMillisPerLevel = 500
# Level from which anchors in other dimensions can be reached.
# Effect: Lower values open other dimensions sooner.
crossDimensionLevel = 3
# Plain ender pearls spent per anchor trip.
# Effect: Higher values make trips cost more.
pearlsPerTrip = 1
# Stacks sent between anchors per plain ender pearl.
# Effect: Higher values make sending cheaper.
stacksPerPearl = 4
# Most stacks moved by one send.
# Effect: Higher values empty bigger storage in one send.
sendStacksMax = 54

# Server defaults and permitted choices for this adaptation's player preferences.
# Effect: Each registered control can be locked or restricted without changing another player's saved choices.
[playerPreferences]

[playerPreferences.control]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "SNEAK"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["SNEAK", "ARMED"]

[playerPreferences.enabled]
# Allows players to choose an unlocked permitted value.
# Effect: False forces the server default without deleting saved player choices.
playerEditable = true
# Default preference value, using its registered uppercase name.
# Effect: Applies when locked or when a saved choice is unavailable; level requirements still apply.
defaultValue = "ON"
# Preference values permitted by the server.
# Effect: Only listed values can be selected; the default must be included.
allowedValues = ["ON", "OFF"]

