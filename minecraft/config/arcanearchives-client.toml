#Play the ongoing sound while a Radiant Resonator grows quartz.
resonatorTicking = true
#Volume of the Radiant Resonator's loop.
#Range: 0.0 ~ 1.0
resonatorVolume = 0.15
#Use the decorated Arcane Archives inventory backgrounds.
usePrettyGUIs = true
#Draw inventory slots behind the Manifest search results.
manifestGrid = false
#Restore the previous search when the Manifest is reopened.
manifestSearchPersistence = false
#Mirror Manifest searches in Just Enough Items while the Manifest is open.
manifestJeiSynchronise = false
#Highlight tracked slots when opening containers from Minecraft or other mods.
manifestHighlightOtherContainers = true
#Fully qualified screen class names to exclude from Manifest slot highlighting.
manifestHighlightExcludedScreens = []
#Hold Shift to keep the Manifest open when starting to track an entry.
manifestShiftKeepsOpen = true
#Maximum distance at which the Manifest can track an inventory.
#Range: 1 ~ 30000
manifestRange = 100
#Use the Arsenal's color-accessible gem icons.
arsenalColourblind = false

